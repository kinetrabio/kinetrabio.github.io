              <div style={{fontSize:10,fontWeight:700,color:"#5ab0d4",letterSpacing:1.5}}>EVIDENCE RECORD — PROTOTYPE</div>
              <div style={{fontSize:9,color:"#3a7a9a",fontStyle:"italic"}}>illustrative · not a verified production feature</div>
            </div>
            <div style={{fontSize:11,color:C.dim,marginBottom:10}}>{ec.trigger}</div>
            {ec.hypotheses.map((h,i)=>(
              <div key={i} style={{marginBottom:8,paddingBottom:8,borderBottom:i<ec.hypotheses.length-1?"1px solid #1a3a4a":"none"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                  <div style={{fontSize:12,color:C.text,fontWeight:i===0?600:400,maxWidth:"75%"}}>{h.hypothesis}</div>
                  <div style={{fontSize:11,fontWeight:600,color:i===0?"#5ab0d4":C.dim}}>{i===0?"Leading":"Alt"}</div>
                </div>
                {h.evidence_for.map((e,j)=>(
                  <div key={j} style={{fontSize:10,color:"#7fbfd4",paddingLeft:10,position:"relative",marginBottom:2}}>
                    <span style={{position:"absolute",left:0}}>+</span>{e}
                  </div>
                ))}
                {h.evidence_against.map((e,j)=>(
                  <div key={j} style={{fontSize:10,color:"#c07f7f",paddingLeft:10,position:"relative",marginBottom:2}}>
                    <span style={{position:"absolute",left:0}}>–</span>{e}
                  </div>
                ))}
              </div>
            ))}
            <div style={{fontSize:10,color:"#5ab0d4",marginTop:8,paddingTop:8,borderTop:"1px solid #1a3a4a"}}>
              <b>Next discriminating evidence:</b> {ec.next_discriminating_evidence}
            </div>
            <div style={{fontSize:10,color:C.dim,marginTop:6,fontStyle:"italic"}}>
              Decision status: {ec.decision_status}
            </div>
          </div>
        );
      })()}

      {/* CHO Specific Productivity (Qp) display — thresholds derived from the loaded golden
          batch's own Qp trajectory (±20%/±40% bands), consistent with how every other
          parameter in this engine is judged relative to reference batch rather than a fixed
          literature constant. Falls back to the literature range (10-60 pg/cell/day) only
          when no reference batch Qp can be computed, so the display never goes silent. */}
      {orgId==="cho"&&data&&data.length>0&&(()=>{
        const qp = calcQp(data);
        if (!qp) return null;
        // Compare against the golden batch's Qp AT THE SAME RUN STAGE, not its terminal Qp —
        // productivity naturally differs between early and late run, so comparing an early
        // current-run snapshot against the golden batch's final-hour Qp is apples-to-oranges
        // and produces a false "off" reading purely from run-stage mismatch, not a real signal.
        const lastHour = data[data.length-1]?.time_hours;
        const goldenSameWindow = golden && lastHour!=null ? golden.filter(r=>r.time_hours<=lastHour) : null;
        const goldenQp = goldenSameWindow && goldenSameWindow.length ? calcQp(goldenSameWindow) : null;
        let qpColor, refLabel;
        if (goldenQp) {
          const pctOff = Math.abs(qp - goldenQp) / goldenQp;
          qpColor = pctOff > 0.40 ? C.warn : pctOff > 0.20 ? "#FB923C" : C.nominal;
          refLabel = "reference batch: "+goldenQp+" pg/cell/day";
        } else {
          // Fallback only — no golden batch Qp available yet to compare against
          qpColor = qp < 15 ? C.warn : qp < 30 ? "#FB923C" : C.nominal;
          refLabel = "literature range 10-60 pg/cell/day — load a reference batch for a process-specific comparison";
        }
        return (
          <div style={{background:"rgba(100,116,139,0.06)",border:"1px solid "+C.border,borderRadius:4,padding:"7px 12px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:10,fontWeight:700,color:C.label,letterSpacing:1.5}}>SPECIFIC PRODUCTIVITY (Qp)</div>
              <div style={{fontSize:9,color:C.dim,marginTop:1}}>{refLabel}</div>
            </div>
            <div style={{fontSize:13,fontWeight:700,color:qpColor}}>{qp} <span style={{fontSize:10,fontWeight:400,color:C.dim}}>pg/cell/day</span></div>
          </div>
        );
      })()}

      {/* E. coli Specific Growth Rate (mu) and RQ display */}
      {(orgId==="ecoli"||orgId==="bacillus")&&data&&data.length>0&&(()=>{
        const mu = orgId==="ecoli" ? calcMuEcoli(data) : null;
        const rq = calcRQ(data);
        if (!mu && !rq) return null;
        const muColor = mu===null ? C.dim : mu>0.20 ? C.warn : mu<0.05 ? "#EF4444" : C.nominal;
        const rqColor = rq===null ? C.dim : rq>1.2 ? C.warn : rq<0.8 ? "#FB923C" : C.nominal;
        return (
          <div style={{background:"rgba(100,116,139,0.06)",border:"1px solid "+C.border,borderRadius:4,padding:"7px 12px",marginBottom:8,display:"flex",gap:20,alignItems:"center"}}>
            {mu!==null&&(
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-start"}}>
                <div style={{fontSize:10,fontWeight:700,color:C.label,letterSpacing:1.5}}>GROWTH RATE (mu)</div>
                <div style={{fontSize:13,fontWeight:700,color:muColor}}>{mu} <span style={{fontSize:10,fontWeight:400,color:C.dim}}>h-1</span></div>
              </div>
            )}
            {rq!==null&&(
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-start"}}>
                <div style={{fontSize:10,fontWeight:700,color:C.label,letterSpacing:1.5}}>RESP. QUOTIENT (RQ)</div>
                <div style={{fontSize:13,fontWeight:700,color:rqColor}}>{rq} <span style={{fontSize:10,fontWeight:400,color:C.dim}}>CER/OUR</span></div>
              </div>
            )}
          </div>
        );
      })()}

      {/* CHO Lactate Shift Phase Indicator */}
      {orgId==="cho"&&data&&data.length>0&&(()=>{
        try {
          const org = ORGANISMS.find(o=>o.id==="cho");
          const last = data[data.length-1];
          const runPctLocal = org ? Math.min(100,Math.round((last.time_hours/org.duration)*100)) : 50;
          const lacResult = detectLactateShift(data, golden, runPctLocal, last.time_hours);
          if (!lacResult) return null;
          const phaseColors = {
            production:{bg:"rgba(59,130,246,0.1)",border:"rgba(59,130,246,0.4)",text:"#60A5FA",label:"LACTATE · PRODUCTION PHASE"},
            shift:{bg:"rgba(234,179,8,0.1)",border:"rgba(234,179,8,0.4)",text:"#EAB308",label:lacResult.shiftDetected?"LACTATE · SHIFT DETECTED OK":"LACTATE · SHIFT ZONE"},
            consumption:{bg:"rgba(0,168,120,0.1)",border:"rgba(0,168,120,0.4)",text:"#00A878",label:"LACTATE · CONSUMPTION PHASE OK"},
            unknown:{bg:"rgba(100,116,139,0.1)",border:"rgba(100,116,139,0.4)",text:"#64748B",label:"LACTATE · PHASE UNKNOWN"},
          };
          const phase = phaseColors[lacResult.phase||"unknown"];
          return (
            <div style={{background:phase.bg,border:"1px solid "+phase.border,borderRadius:4,padding:"7px 12px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontSize:10,fontWeight:700,color:phase.text,letterSpacing:1.5}}>{phase.label}</div>
              {lacResult.concern&&<div style={{fontSize:10,fontWeight:700,color:result.riskColor,letterSpacing:1}}>{lacResult.concern.toUpperCase()}</div>}
              {!lacResult.concern&&<div style={{fontSize:10,color:phase.text,opacity:0.7}}>Normal</div>}
            </div>
          );
        } catch(e) { return null; }
      })()}

      {!primarySignal&&result.pdi<=20&&(
        <div style={{fontSize:12,color:C.nominal,fontWeight:500}}>Process tracking within expected range. No signal detected.</div>
      )}
    </div>
  );
}

function App(){
  const [orgId,   setOrgId]   = React.useState("cho");
  const [curr,    setCurr]    = React.useState(null);
  const [gold,    setGold]    = React.useState(null);
  const [goldName, setGoldName] = React.useState(null);
  const [currName, setCurrName] = React.useState(null);
  // ── MEDIA LAYER STATE ──────────────────────────────────────────────────
  // Captures media lot metadata at batch start. Used by Evidence Record to add
  // a media lot variability hypothesis when a process deviation fires.
  const [mediaLot, setMediaLot] = React.useState({
    currentLot: "", currentSupplier: "", currentOsmolality: "", currentGlutamine: "",
    referenceLot: "", referenceOsmolality: "", referenceGlutamine: "",
  });
  const [alerts,  setAlerts]  = React.useState([]);
  const [divHour, setDivHour] = React.useState(null);
  const [selParam,setSelParam]= React.useState(null);
  const [log,     setLog]     = React.useState([]);
  const [ackd,    setAckd]    = React.useState({});
  const [timeIdx, setTimeIdx] = React.useState(null);
  const [loadError, setLoadError] = React.useState(null);
  // Real batch archive, keyed per organism — {orgId: [batchRows, batchRows, ...]}.
  // Empty by default, which is what every module ships with today; nothing here
  // changes behavior until real batches are actually loaded in.
  const [archive, setArchive] = React.useState({});
  const [archiveError, setArchiveError] = React.useState(null);

  const loadArchive = (file) => {
    const r = new FileReader();
    r.onload = e => {
      try {
        const parsed = JSON.parse(e.target.result);
        // Expected shape: { [orgId]: [ [rowObj, rowObj, ...], [rowObj, ...], ... ], ... }
        if (typeof parsed !== "object" || parsed === null) throw new Error("Archive file must be a JSON object keyed by organism id");
        setArchive(parsed);
        setArchiveError(null);
        const total = Object.values(parsed).reduce((sum, batches) => sum + (Array.isArray(batches) ? batches.length : 0), 0);
        setLog(l => [new Date().toLocaleTimeString() + "  Archive loaded  " + total + " real batch" + (total !== 1 ? "es" : "") + " across " + Object.keys(parsed).length + " module" + (Object.keys(parsed).length !== 1 ? "s" : ""), ...l].slice(0, 10));
      } catch (err) {
        setArchiveError("Could not parse archive file: " + err.message);
      }
    };
    r.readAsText(file);
  };

  // Adds the currently-loaded current-run data to the archive for this organism.
  // Requires explicit confirmation (confirmedReal) that this is a genuine historical
  // batch, not a test/synthetic run — the archive's validity depends entirely on
  // every entry being real, so this is not auto-added silently.
  const addCurrentRunToArchive = () => {
    if (!curr || !curr.length) return;
    setArchive(prev => {
      const existing = prev[orgId] || [];
      return { ...prev, [orgId]: [...existing, curr] };
    });
    setLog(l => [new Date().toLocaleTimeString() + "  Added current run to " + orgId + " archive  (now " + ((archive[orgId] || []).length + 1) + " real batches)", ...l].slice(0, 10));
  };

  const downloadArchive = () => {
    const blob = new Blob([JSON.stringify(archive, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "kinetra_batch_archive_" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    URL.revokeObjectURL(url);
  };

  const org=ORGANISMS.find(o=>o.id===orgId),params=PARAMS[orgId]||[];
  React.useEffect(()=>{setCurr(null);setGold(null);setAlerts([]);setDivHour(null);setSelParam(null);setAckd({});setTimeIdx(null);setLoadError(null);},[orgId]);

  const load=(type,file)=>{
    const r=new FileReader();
    r.onload=e=>{
      const data=parseCSV(e.target.result),ts=new Date().toLocaleTimeString();
      const check=validateCSV(data,params,org?org.label:null);
      if(!check.valid){
        setLoadError({type,errors:check.errors,fileName:file.name});
        setLog(l=>[ts+"  REJECTED  "+file.name+"  —  "+check.errors.length+" schema error"+(check.errors.length!==1?"s":""),...l].slice(0,10));
        return;
      }
      setLoadError(null);
      if(type==="curr"){const fired=evaluate(orgId,data);setCurr(data);setCurrName(file.name);setAlerts(fired);setTimeIdx(data.length-1);setLog(l=>[ts+"  Current run  "+data.length+" rows  "+fired.length+" alert"+(fired.length!==1?"s":""),...l].slice(0,10));}
      else{setGold(data);setGoldName(file.name);setLog(l=>[ts+"  Reference batch  "+data.length+" rows",...l].slice(0,10));}
    };
    r.readAsText(file);
  };

  const viewCurr = curr && timeIdx!=null ? curr.slice(0, timeIdx+1) : curr;

  React.useEffect(()=>{
    if(viewCurr&&gold){const result=findDivergence(viewCurr,gold,params,orgId);setDivHour(result);if(result.hour!=null)setLog(l=>["Divergence  Hour "+result.hour+"  "+result.details.length+" parameter"+(result.details.length!==1?"s":""),...l].slice(0,10));}
  },[viewCurr,gold]);

  React.useEffect(()=>{
    if(viewCurr){const fired=evaluate(orgId,viewCurr);setAlerts(fired);}
  },[viewCurr]);

  // Single authoritative status signal. Previously this engine computed three independent,
  // unreconciled opinions here: a Health score (point-deduction heuristic), an alert-count-based
  // STATUS label, and PDI (Bayesian evidence-weighted score, computed separately inside PDIPanel).
  // These could and did disagree with each other on the same data, which is confusing rather than
  // informative -- redundant approximations of the same underlying question ("is this run okay")
  // read as unreliability, not depth. PDI is the most rigorous of the three (calibrated per-organism,
  // validated across all six modules), so it's now the sole headline signal. Active alert count is
  // kept as real, actionable supporting detail underneath -- not a second competing opinion.
  const pdiResult = viewCurr && gold ? calcBayesian(orgId, viewCurr, gold, params, alerts, divHour, archive[orgId]) : null;
  const crits=alerts.filter(a=>a.level==="CRITICAL"),warns=alerts.filter(a=>a.level==="WARN");
  const last=viewCurr?viewCurr[viewCurr.length-1]:null;
  const runPct=last&&org?Math.min(100,Math.round((last.time_hours/org.duration)*100)):null;
  const ap=selParam?params.find(p=>p.key===selParam):null;
  const overallStatus=pdiResult?pdiResult.riskLevel:(viewCurr?"NO REFERENCE BATCH":"NO DATA");
  const overallColor=pdiResult?pdiResult.riskColor:C.dim;

  return(
    <div style={{background:C.bg,minHeight:"100vh",padding:"14px 18px"}}>

      <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:4,padding:"10px 18px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:18}}>
          <div>
            <div style={{fontSize:10,color:C.label,letterSpacing:2,fontWeight:600,marginBottom:1}}>KINETRA BIO · ENGINE v5.9.8</div>
            <div style={{fontSize:17,fontWeight:700,color:C.text}}>Bioprocess Intelligence Platform</div>
          </div>
          <div style={{width:1,height:34,background:C.border}}/>
          <div style={{display:"flex",gap:6}}>
            {ORGANISMS.map(o=>(
              <button key={o.id} onClick={()=>setOrgId(o.id)} style={{fontSize:12,fontWeight:700,letterSpacing:1,padding:"6px 14px",borderRadius:3,cursor:"pointer",border:"1px solid "+(orgId===o.id?C.text:C.border),background:orgId===o.id?C.text:"transparent",color:orgId===o.id?C.bg:C.label,textTransform:"uppercase"}}>{o.short}</button>
            ))}
          </div>
          <div style={{fontSize:11,color:C.dim}}>Perfusion ➜ kinetra-cho-perfusion-module.html  |  CAR-T ➜ kinetra-cart-allo-standalone.html</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:20}}>
          {runPct!=null&&<div style={{textAlign:"right"}}>
            <div style={{fontSize:11,color:C.label,marginBottom:2}}>RUN PROGRESS</div>
            <div style={{fontSize:18,fontWeight:700,color:C.text}}>{runPct}<span style={{fontSize:12,color:C.label}}>%  Hour {last.time_hours} of {org.duration}</span></div>
          </div>}
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,color:C.label,marginBottom:2}}>STATUS</div>
            <div style={{fontSize:18,fontWeight:700,color:overallColor}}>{overallStatus}</div>
            {(crits.length>0||warns.length>0)&&<div style={{fontSize:10,color:C.dim,marginTop:1}}>{crits.length>0?crits.length+" critical":""}{crits.length>0&&warns.length>0?", ":""}{warns.length>0?warns.length+" warning"+(warns.length!==1?"s":""):""}</div>}
          </div>
        </div>
      </div>

      {loadError && <div style={{background:"rgba(239,68,68,0.08)",border:"1px solid "+C.critical,borderRadius:4,padding:"12px 18px",marginBottom:10}}>
        <div style={{fontSize:13,fontWeight:700,color:C.critical,marginBottom:6}}>File rejected — "{loadError.fileName}" ({loadError.type==="curr"?"Current Run":"Reference Batch"} slot)</div>
        {loadError.errors.map((err,i)=>(<div key={i} style={{fontSize:12,color:C.text,marginBottom:2}}>{i===0?err:"• "+err}</div>))}
        <div style={{fontSize:11,color:C.dim,marginTop:6}}>Check that the CSV's column headers exactly match what this organism module expects, then try loading it again.</div>
      </div>}

      <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:4,padding:"7px 18px",marginBottom:10,display:"flex",gap:32,alignItems:"center"}}>
        <div><span style={{fontSize:11,color:C.label}}>ORGANISM  </span><span style={{fontSize:13,fontWeight:700,color:C.text}}>{org?org.label:""}</span></div>
        <div><span style={{fontSize:11,color:C.label}}>EXPECTED DURATION  </span><span style={{fontSize:13,fontWeight:700,color:C.text}}>{org?org.duration:""} hours</span></div>
        <div><span style={{fontSize:11,color:C.label}}>WATCH FOR  </span><span style={{fontSize:13,fontWeight:600,color:C.warn}}>{org?org.watchFor:""}</span></div>
        {org&&org.validationLabel&&<div style={{borderTop:"1px solid "+C.border,marginTop:6,paddingTop:6,width:"100%"}}><span style={{fontSize:10,color:C.label}}>VALIDATION STATUS  </span><span style={{fontSize:12,fontWeight:700,color:C.nominal}}>{org.validationLabel}</span>{org.validationFootnote&&<div style={{fontSize:10,color:C.dim,marginTop:3}}>{org.validationFootnote}</div>}</div>}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 380px",gap:12}}>
        <div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
            <label style={{cursor:"pointer",background:C.panel,border:"1px solid "+(gold?C.nominal:C.border),borderRadius:4,padding:"9px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:11,color:C.label,marginBottom:2}}>REFERENCE BATCH</div>
                <div style={{fontSize:13,fontWeight:600,color:gold?C.nominal:C.dim}}>{gold?"Loaded  —  "+gold.length+" rows":"Click to load CSV"}</div>
              </div>
              <span style={{fontSize:22,color:gold?C.nominal:C.dim}}>{gold?"OK":"+"}</span>
              <input type="file" accept=".csv" onChange={e=>{const f=e.target.files[0];if(f)load("gold",f);}}/>
            </label>
            <label style={{cursor:"pointer",background:C.panel,border:"1px solid "+(curr?(crits.length>0?C.critical:warns.length>0?C.warn:C.nominal):C.border),borderRadius:4,padding:"9px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:11,color:C.label,marginBottom:2}}>CURRENT RUN</div>
                <div style={{fontSize:13,fontWeight:600,color:curr?(crits.length>0?C.critical:warns.length>0?C.warn:C.nominal):C.dim}}>{curr?"Loaded  —  "+curr.length+" rows":"Click to load CSV"}</div>
              </div>
              <span style={{fontSize:22,color:curr?(crits.length>0?C.critical:warns.length>0?C.warn:C.nominal):C.dim}}>{curr?"OK":"+"}</span>
              <input type="file" accept=".csv" onChange={e=>{const f=e.target.files[0];if(f)load("curr",f);}}/>
            </label>
          </div>

          {/* ── MEDIA LOT INTAKE — EVIDENCE RECORD LAYER ────────────────────────
              Captures media lot metadata at batch start. Used by the Evidence Record
              to add a media lot variability hypothesis when a process deviation fires.
              No analytical measurement — certificate-of-analysis values only.
              Data stays local, never transmitted. ────────────────────────────── */}
          <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:4,padding:"10px 14px",marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:700,color:C.label,letterSpacing:1.2,marginBottom:8}}>MEDIA LOT — OPTIONAL · FOR EVIDENCE RECORD ONLY</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <div>
                <div style={{fontSize:10,color:C.label,marginBottom:3}}>CURRENT RUN LOT</div>
                <input placeholder="Lot number" value={mediaLot.currentLot}
                  onChange={e=>setMediaLot(m=>({...m,currentLot:e.target.value}))}
                  style={{width:"100%",background:C.bg,border:"1px solid "+C.border,color:C.text,padding:"4px 8px",borderRadius:3,fontSize:12,marginBottom:4}}/>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
                  <input placeholder="Osmolality (mOsm)" value={mediaLot.currentOsmolality}
                    onChange={e=>setMediaLot(m=>({...m,currentOsmolality:e.target.value}))}
                    style={{background:C.bg,border:"1px solid "+C.border,color:C.text,padding:"4px 8px",borderRadius:3,fontSize:11}}/>
                  <input placeholder="Glutamine (mM)" value={mediaLot.currentGlutamine}
                    onChange={e=>setMediaLot(m=>({...m,currentGlutamine:e.target.value}))}
                    style={{background:C.bg,border:"1px solid "+C.border,color:C.text,padding:"4px 8px",borderRadius:3,fontSize:11}}/>
                </div>
              </div>
              <div>
                <div style={{fontSize:10,color:C.label,marginBottom:3}}>REFERENCE BATCH LOT</div>
                <input placeholder="Lot number" value={mediaLot.referenceLot}
                  onChange={e=>setMediaLot(m=>({...m,referenceLot:e.target.value}))}
                  style={{width:"100%",background:C.bg,border:"1px solid "+C.border,color:C.text,padding:"4px 8px",borderRadius:3,fontSize:12,marginBottom:4}}/>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
                  <input placeholder="Osmolality (mOsm)" value={mediaLot.referenceOsmolality}
                    onChange={e=>setMediaLot(m=>({...m,referenceOsmolality:e.target.value}))}
                    style={{background:C.bg,border:"1px solid "+C.border,color:C.text,padding:"4px 8px",borderRadius:3,fontSize:11}}/>
                  <input placeholder="Glutamine (mM)" value={mediaLot.referenceGlutamine}
                    onChange={e=>setMediaLot(m=>({...m,referenceGlutamine:e.target.value}))}
                    style={{background:C.bg,border:"1px solid "+C.border,color:C.text,padding:"4px 8px",borderRadius:3,fontSize:11}}/>
                </div>
              </div>
            </div>
            {mediaLot.currentLot && mediaLot.referenceLot && mediaLot.currentLot !== mediaLot.referenceLot && (
              <div style={{marginTop:8,padding:"6px 10px",background:"rgba(232,168,56,0.08)",border:"1px solid rgba(232,168,56,0.3)",borderRadius:3,fontSize:11,color:C.warn}}>
                ⚠ Media lot change detected — current lot ({mediaLot.currentLot}) differs from reference batch lot ({mediaLot.referenceLot}). If a deviation fires, the Evidence Record will include a media lot variability hypothesis.
              </div>
            )}
            {mediaLot.currentLot && mediaLot.referenceLot && mediaLot.currentLot === mediaLot.referenceLot && (
              <div style={{marginTop:8,padding:"6px 10px",background:"rgba(76,175,122,0.06)",border:"1px solid rgba(76,175,122,0.2)",borderRadius:3,fontSize:11,color:C.nominal}}>
                ✓ Media lot consistent with reference batch — lot variability hypothesis suppressed in Evidence Record
              </div>
            )}
          </div>

          <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:4,padding:"9px 16px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div>
                <div style={{fontSize:11,color:C.label,marginBottom:2}}>BATCH ARCHIVE — {org?org.label:""}</div>
                <div style={{fontSize:13,fontWeight:600,color:(archive[orgId]||[]).length>0?C.nominal:C.dim}}>
                  {(archive[orgId]||[]).length===0
                    ? "No real batches loaded — bands are pre-validation (single reference batch)"
                    : calibrationStage(1+(archive[orgId]||[]).length).label+"  —  "+(archive[orgId]||[]).length+" real batch"+((archive[orgId]||[]).length!==1?"es":"")+" + golden"}
                </div>
              </div>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <label style={{cursor:"pointer",fontSize:11,fontWeight:600,color:C.label,border:"1px solid "+C.border,borderRadius:3,padding:"5px 10px"}}>
                Load archive.json
                <input type="file" accept=".json" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(f)loadArchive(f);}}/>
              </label>
              <button
                disabled={!curr||!curr.length}
                onClick={()=>{
                  if(window.confirm("Confirm: is the currently loaded CURRENT RUN a genuine historical batch (not a test, synthetic, or fault-scenario run)?\n\nOnly real batches should go into the archive — its calibration value depends entirely on every entry being real."))
                    addCurrentRunToArchive();
                }}
                style={{cursor:curr&&curr.length?"pointer":"not-allowed",fontSize:11,fontWeight:600,color:curr&&curr.length?C.label:C.dim,border:"1px solid "+C.border,borderRadius:3,padding:"5px 10px",background:"transparent"}}>
                + Add current run (real batch)
              </button>
              <button onClick={downloadArchive}
                disabled={Object.keys(archive).length===0}
                style={{cursor:Object.keys(archive).length?"pointer":"not-allowed",fontSize:11,fontWeight:600,color:Object.keys(archive).length?C.label:C.dim,border:"1px solid "+C.border,borderRadius:3,padding:"5px 10px",background:"transparent"}}>
                Download archive.json
              </button>
            </div>
          </div>
          {archiveError && <div style={{fontSize:12,color:C.critical,marginBottom:10}}>{archiveError}</div>}

          {curr&&timeIdx!=null&&<div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:4,padding:"10px 16px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <span style={{fontSize:11,color:C.label,letterSpacing:1,fontWeight:600}}>RUN HOUR SCRUBBER</span>
              <span style={{fontSize:14,fontWeight:700,color:C.text}}>Hour {curr[timeIdx].time_hours} <span style={{fontSize:11,color:C.label}}>of {org?org.duration:240}h ({Math.min(100,Math.round(curr[timeIdx].time_hours/(org?org.duration:240)*100))}% complete)</span></span>
            </div>
            <input type="range" min={0} max={curr.length-1} value={timeIdx}
              onChange={e=>setTimeIdx(Number(e.target.value))}
              style={{width:"100%",accentColor:C.nominal,cursor:"pointer",height:4}}
            />
            <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}>
              <span style={{fontSize:10,color:C.dim}}>Hour 0</span>
              <span style={{fontSize:10,color:C.dim}}>Hour {org?org.duration:240}</span>
            </div>
          </div>}

          {runPct!=null&&<div style={{marginBottom:10}}>
            <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:3,height:5,overflow:"hidden"}}>
              <div style={{height:"100%",background:C.nominal,width:runPct+"%"}}/>
            </div>
          </div>}

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:10,marginBottom:12}}>
            {params.map(p=><Faceplate key={p.key} param={p} curr={viewCurr} gold={gold} selected={selParam===p.key} onClick={()=>setSelParam(selParam===p.key?null:p.key)}/>)}
          </div>

          {ap&&viewCurr&&<TrendChart param={ap} curr={viewCurr} gold={gold} divHour={divHour&&divHour.hour} h={210}/>}

          {!curr&&<div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:4,padding:48,textAlign:"center"}}>
            <div style={{fontSize:14,color:C.label,marginBottom:8,fontWeight:600}}>Load a current run CSV to begin analysis</div>
            <div style={{fontSize:13,color:C.dim}}>Load reference batch first for divergence detection and comparison overlay</div>
          </div>}
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:10}}>

          {viewCurr&&<PDIPanel orgId={orgId} data={viewCurr} golden={gold} params={params} alerts={alerts} divHour={divHour} archive={archive[orgId]} goldName={goldName} currName={currName} mediaLot={mediaLot}/>}
          {viewCurr&&<ParamCoveragePanel orgId={orgId} data={viewCurr} params={params}/>}

          {viewCurr&&gold&&divHour&&divHour.hour!=null&&(
            <div style={{background:C.divCard,border:"1px solid "+C.divBorder,borderRadius:4,padding:"14px 16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontSize:13,fontWeight:700,color:C.divText,letterSpacing:1}}>EARLY DETECTION</span>
                <span style={{fontSize:13,fontWeight:700,color:C.divText}}>HOUR {divHour.hour}</span>
              </div>
              <div style={{fontSize:13,color:C.divText,lineHeight:1.6,marginBottom:10}}>Trajectory diverging from reference batch. No threshold breached. Intervention window open.</div>
              {divHour.details.map((d,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderTop:"1px solid "+C.divBorder}}>
                  <span style={{fontSize:12,color:C.divText,fontWeight:600}}>{d.label}</span>
                  <span style={{fontSize:12,color:C.label}}>{d.pct}% off  ·  {d.cv} vs {d.gv}</span>
                </div>
              ))}
              <div style={{display:"flex",gap:8,marginTop:10,paddingTop:10,borderTop:"1px solid "+C.divBorder}}>
                <button onClick={()=>{
                  const subj=encodeURIComponent("Kinetra Early Detection — "+(org?org.label:"")+" — Hour "+divHour.hour);
                  const bod=encodeURIComponent("Kinetra Bio — Early Detection Alert\n\nProcess: "+(org?org.label:"")+"\nDetected: Hour "+divHour.hour+"\nStatus: No threshold breached — intervention window open\n\n"+divHour.details.map(d=>"  "+d.label+": "+d.pct+"% off baseline  current "+d.cv+"  golden "+d.gv).join("\n")+"\n\nKinetra Engine v5.9.8");
                  window.open("mailto:?subject="+subj+"&body="+bod);
                }} style={{fontSize:12,padding:"6px 12px",borderRadius:3,cursor:"pointer",border:"1px solid "+C.divBorder,background:"transparent",color:C.divText,fontWeight:600}}>Email Alert</button>
                <button onClick={()=>{
                  navigator.clipboard.writeText("Kinetra Alert — "+(org?org.label:"")+" — Divergence Hour "+divHour.hour+" — "+divHour.details.map(d=>d.label+" "+d.pct+"% off baseline").join(", ")+" — No threshold breached").then(()=>alert("Copied to clipboard"));
                }} style={{fontSize:12,padding:"6px 12px",borderRadius:3,cursor:"pointer",border:"1px solid "+C.divBorder,background:"transparent",color:C.divText,fontWeight:600}}>Copy SMS</button>
              </div>
            </div>
          )}

          {viewCurr&&alerts.length===0&&(!divHour||divHour.hour==null)&&(
            <div style={{background:C.panel,border:"1px solid "+C.nominal,borderRadius:4,padding:"14px 16px"}}>
              <div style={{fontSize:14,fontWeight:700,color:C.nominal}}>All parameters nominal</div>
              <div style={{fontSize:12,color:C.label,marginTop:4}}>No intervention required.</div>
            </div>
          )}

          {alerts.map((a,i)=>{
            const key="a"+i,ts=new Date().toLocaleTimeString();
            return(
              <div key={i} style={{background:C.panel,border:"1px solid "+(a.level==="CRITICAL"?C.critical:C.warn),borderRadius:4,padding:"14px 16px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <span style={{fontSize:13,fontWeight:700,color:a.level==="CRITICAL"?C.critical:C.warn,letterSpacing:1}}>{a.level}</span>
                  <span style={{fontSize:11,color:C.dim}}>{ackd[key]?"Ack "+ackd[key]:ts}</span>
                </div>
                <div style={{fontSize:13,color:C.text,lineHeight:1.7,marginBottom:10}}>{a.text}</div>
                {!ackd[key]&&<button onClick={()=>setAckd(p=>({...p,[key]:new Date().toLocaleTimeString()}))} style={{fontSize:12,padding:"5px 14px",borderRadius:3,cursor:"pointer",border:"1px solid "+(a.level==="CRITICAL"?C.critical:C.warn),background:"transparent",color:a.level==="CRITICAL"?C.critical:C.warn,fontWeight:600}}>Acknowledge</button>}
                {ackd[key]&&<span style={{fontSize:12,color:C.nominal,fontWeight:600}}>Acknowledged  {ackd[key]}  —  Logged</span>}
              </div>
            );
          })}

          {!curr&&<div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:4,padding:"14px 16px"}}>
            <div style={{fontSize:12,color:C.dim}}>Load current run data to see intervention recommendations.</div>
          </div>}

          {log.length>0&&<div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:4,padding:"12px 14px"}}>
            <div style={{fontSize:11,color:C.label,letterSpacing:1,marginBottom:6}}>SESSION LOG</div>
            {log.map((e,i)=><div key={i} style={{fontSize:12,color:C.dim,marginBottom:3}}>{">  "+e}</div>)}
          </div>}

          {SHOW_APQ_PANEL && <APQPanel org={org} curr={viewCurr} gold={gold} params={params} alerts={alerts} divHour={divHour} orgId={orgId}/>}
        </div>
      </div>

      <div style={{marginTop:12,paddingTop:8,borderTop:"1px solid "+C.border,display:"flex",justifyContent:"space-between"}}>
        <span style={{fontSize:11,color:C.dim,letterSpacing:0.5}}>KINETRA BIO  ·  ENGINE v5.9.8  ·  ADAPTIVE PROCESS QUALIFICATION  ·  NO DATA TRANSMITTED  ·  RUNS LOCALLY</span>
        <span style={{fontSize:11,color:C.dim}}>CHO  ·  E.COLI  ·  BACILLUS  ·  YEAST  ·  ANAEROBIC</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
