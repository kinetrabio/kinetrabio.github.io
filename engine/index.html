function parseCSV(text){
  const lines=text.trim().split("\n");
  const headers=lines[0].split(",").map(h=>h.trim());
  return lines.slice(1).filter(l=>l.trim()).map(line=>{
    const vals=line.split(","),row={};
    headers.forEach((h,i)=>{const v=(vals[i]||"").trim();row[h]=(!isNaN(v)&&v!=="")?parseFloat(v):v;});
    return row;
  });
}

function evaluate(orgId,data){
  const last=data[data.length-1];if(!last)return[];
  return(INTERVENTIONS[orgId]||[]).filter(i=>{try{return i.check(last);}catch(e){return false;}});
}

// ── CSV SCHEMA VALIDATION ──
// Checks that a loaded file actually has the columns this organism module
// expects before accepting it, instead of silently proceeding with
// undefined values that produce nonsensical PDI/Health readings later.
// Distinguishes "column never existed in this file" (a real problem) from
// "this row's value is blank" (fine — some parameters sample sparsely).
// ── PHYSICAL PLAUSIBILITY CHECKS ──
// Catches structurally-valid-but-nonsensical data (negative concentrations, pH outside
// 0-14, percentages outside 0-100, wildly implausible temperatures) that schema validation
// alone can't catch -- a file can have all the right column names and still contain garbage
// values (unit errors, decimal misplacement, wrong data mapped to the wrong column).
// Deliberately conservative: only flags clear physical impossibilities, not judgment-call
// thresholds -- an overly tight bound risks rejecting legitimate real customer data, which
// is worse than letting through something merely unusual.
function checkPhysicalPlausibility(data, params) {
  const violations = [];
  const maxPerParam = 3; // cap how many rows we report per parameter, avoid a wall of text
  params.forEach(p => {
    if (p.key === "induced") return; // boolean flag, not a continuous physical quantity
    let bad = [];
    data.forEach(row => {
      const v = row[p.key];
      if (v == null || isNaN(v)) return;
      let isBad = false, reason = "";
      if (p.key === "pH") {
        if (v < 0 || v > 14) { isBad = true; reason = "pH must be 0-14"; }
      } else if (p.key.endsWith("_percent")) {
        if (v < 0 || v > 100) { isBad = true; reason = p.label + " must be 0-100%"; }
      } else if (p.key === "temperature_C") {
        if (v < -10 || v > 60) { isBad = true; reason = "temperature outside plausible bioreactor range (-10 to 60C) -- check units"; }
      } else {
        if (v < 0) { isBad = true; reason = p.label + " cannot be negative"; }
      }
      if (isBad) bad.push({hour: row.time_hours, value: v, reason});
    });
    if (bad.length) violations.push({param: p.key, label: p.label, count: bad.length, examples: bad.slice(0, maxPerParam)});
  });
  return violations;
}

function validateCSV(data, params, orgLabel){
  if(!data||!data.length) return {valid:false, errors:["File appears empty or could not be parsed."]};
  const sample=data[0];
  const errors=[];
  if(!("time_hours" in sample)) errors.push("Missing required column: time_hours");
  if(!("phase" in sample) && params.some(p=>p.key==="phase")) errors.push("Missing required column: phase");
  params.forEach(p=>{
    if(p.optional) return;
    if(!(p.key in sample)) errors.push("Missing expected column: "+p.key+(p.label?" ("+p.label+")":""));
  });
  if(errors.length){
    errors.unshift("This file doesn't match the "+(orgLabel||"selected organism")+" module's expected format.");
    return {valid:false, errors};
  }

  // Schema is fine -- now check whether the actual values make physical sense
  const plausibility = checkPhysicalPlausibility(data, params);
  if (plausibility.length) {
    const errs = ["This file has values outside physically plausible ranges."];
    plausibility.forEach(v => {
      const ex = v.examples.map(e => "hour " + e.hour + ": " + e.value).join(", ");
      errs.push(v.label + " (" + v.param + "): " + v.count + " row" + (v.count!==1?"s":"") + " out of range -- e.g. " + ex + (v.count > v.examples.length ? ", ..." : ""));
    });
    return {valid:false, errors:errs};
  }

  return {valid:true, errors:[]};
}

function findDivergence(current,golden,params,orgId){
  if(!golden||!golden.length)return{hour:null,details:[]};
  const threshold=DIV_THRESHOLD[orgId]||0.12;
  const org=ORGANISMS.find(o=>o.id===orgId);
  const orgDuration=org?org.duration:240;

  // COMPLETE FIX (found + built from testing, not a quick patch):
  //
  // ROOT CAUSE: the original check compared current[t] to golden[t] at the exact same
  // hour, with zero tolerance for timing. Near any sharp transition (a feed rate stepping
  // from 0 to ramped at a phase boundary), a batch whose transition lands even an hour or
  // two off from golden shows a huge apparent divergence at that single hour -- not because
  // anything is wrong, but because the check has no concept of "this just happened a bit
  // early/late." A denominator fix alone (flooring near-zero golden values) only fixes the
  // SIZE of the resulting number, not the fact that a pure timing shift still gets flagged
  // as if it were a real deviation.
  //
  // FIX: instead of comparing only to golden's value at the exact same hour, compare to the
  // BEST-MATCHING golden value within a bounded timing-tolerance window, and take the minimum
  // divergence found. A value that matches golden's trajectory a few hours off is timing, not
  // a fault. A value that doesn't match golden ANYWHERE nearby -- because the underlying
  // process is actually different, not just shifted in time -- still gets caught, since a
  // sustained real deviation (e.g. a DO crash that stays low for many hours) won't find a
  // matching golden value nearby either.
  //
  // Window size: +/-5% of the organism's total run duration -- the SAME "realistic run-to-run
  // kinetic variance" magnitude already used and validated throughout this engine's synthetic
  // healthy-variant testing methodology, not a fresh arbitrary number.
  const timingWindow = orgDuration * 0.05;

  const goldenSorted = golden
    .filter(r => r.time_hours != null)
    .slice()
    .sort((a,b) => a.time_hours - b.time_hours);

  const paramRanges = {};
  params.forEach(p => {
    const vals = golden.map(r => r[p.key]).filter(v => v != null && !isNaN(v));
    paramRanges[p.key] = vals.length ? Math.max(...vals) - Math.min(...vals) : 0;
  });

  let firstHour=null;const divParams={};
  for(const row of current){
    const t = row.time_hours;
    for(const p of params){
      const cv=row[p.key];
      if(cv==null||isNaN(cv))continue;

      // Search all golden points within the timing-tolerance window; keep the
      // best (lowest-divergence) match rather than only the exact-hour point.
      const candidates = goldenSorted.filter(g => Math.abs(g.time_hours - t) <= timingWindow && g[p.key] != null && !isNaN(g[p.key]));
      if (candidates.length === 0) continue;

      const rangeFloor = (paramRanges[p.key]||0) * 0.05;
      let bestPct = Infinity, bestMatch = null;
      for (const g of candidates) {
        const gv = g[p.key];
        const denom = Math.max(Math.abs(gv), rangeFloor, 0.001);
        const pct = Math.abs((cv-gv)/denom);
        if (pct < bestPct) { bestPct = pct; bestMatch = g; }
      }

      if(bestPct>threshold&&!divParams[p.key]){
        divParams[p.key]={label:p.label,hour:t,pct:Math.round(bestPct*100),cv:cv.toFixed(2),gv:bestMatch.time_hours===t?bestMatch[p.key].toFixed(2):bestMatch[p.key].toFixed(2)+" (matched at h"+bestMatch.time_hours+")"};
        if(firstHour===null)firstHour=t;
      }
    }
  }
  return{hour:firstHour,details:Object.values(divParams).sort((a,b)=>a.hour-b.hour)};
}

function getTrend(data,key){
  if(!data||data.length<3)return"—";
  const last=data[data.length-1][key],prev=data[data.length-3][key];
  if(last==null||prev==null||isNaN(last)||isNaN(prev))return"—";
  const diff=last-prev,pct=Math.abs(diff/(Math.abs(prev)+0.001));
  if(pct<0.02)return"—";
  return diff>0?"^":"v";
}

function getStatus(p,val){
  if(val==null||isNaN(val))return"nominal";
  if(p.critLow!=null&&val<p.critLow)return"critical";
  if(p.critHigh!=null&&val>p.critHigh)return"critical";
  if(p.warnLow!=null&&val<p.warnLow)return"warn";
  if(p.warnHigh!=null&&val>p.warnHigh)return"warn";
  return"nominal";
}

function sc(s){return s==="critical"?C.critical:s==="warn"?C.warn:C.nominal;}

function Sparkline({data,pKey,color}){
  if(!data||data.length<2)return null;
  const W=90,H=28,vals=data.slice(-14).map(r=>r[pKey]).filter(v=>v!=null&&!isNaN(v));
  if(vals.length<2)return null;
  const vMin=Math.min(...vals),vMax=Math.max(...vals),range=vMax-vMin||1;
  const path=vals.map((v,i)=>`${i===0?"M":"L"}${((i/(vals.length-1))*W).toFixed(1)},${(H-2-((v-vMin)/range)*(H-4)).toFixed(1)}`).join(" ");
  return <svg width={W} height={H} style={{display:"block"}}><path d={path} fill="none" stroke={color} strokeWidth="1.5" opacity="0.9"/></svg>;
}

function TrendChart({param,curr,gold,divHour,h=200}){
  // Compute GP confidence bands from golden batch
  const gpBandPath = React.useMemo(() => {
    if (!gold || gold.length < 3 || !curr || curr.length < 1) return null;
    const testTimes = curr.map(r=>r.time_hours).filter(t=>t!=null&&!isNaN(t));
    if (testTimes.length < 1) return null;
    try {
      const bands = buildGPBands(gold, testTimes, param.key);
      if (!bands) return null;
      // Need to compute tx/ty here — use the same domain as the chart
      const all = [...(curr||[]),...(gold||[])];
      const tVals = all.map(r=>r.time_hours).filter(v=>v!=null&&!isNaN(v));
      const vVals = all.map(r=>r[param.key]).filter(v=>v!=null&&!isNaN(v));
      if (!tVals.length||!vVals.length) return null;
      const tMin=Math.min(...tVals),tMax=Math.max(...tVals);
      const yMin=param.yMin!=null?param.yMin:Math.min(...vVals)*0.92;
      const yMax=param.yMax!=null?param.yMax:Math.max(...vVals)*1.08;
      const W2=680,PAD2={t:12,r:14,b:28,l:46};
      const cw2=W2-PAD2.l-PAD2.r,ch2=h-PAD2.t-PAD2.b;
      const tx2=t=>PAD2.l+((t-tMin)/((tMax-tMin)||1))*cw2;
      const ty2=v=>PAD2.t+ch2-((v-yMin)/((yMax-yMin)||1))*ch2;
      // Build SVG path for upper bound, lower bound, and filled area
      const validBands = bands.filter(b=>b.upper!=null&&b.lower!=null);
      if (validBands.length < 2) return null;
      const upperPts = validBands.map((b,i)=>`${i===0?"M":"L"}${tx2(b.t).toFixed(1)},${ty2(Math.min(b.upper,yMax)).toFixed(1)}`).join(" ");
      const lowerPts = [...validBands].reverse().map((b,i)=>`${i===0?"L":"L"}${tx2(b.t).toFixed(1)},${ty2(Math.max(b.lower,yMin)).toFixed(1)}`).join(" ");
      const area = upperPts + " " + lowerPts + " Z";
      return { area, upper: upperPts, lower: validBands.map((b,i)=>`${i===0?"M":"L"}${tx2(b.t).toFixed(1)},${ty2(Math.max(b.lower,yMin)).toFixed(1)}`).join(" ") };
    } catch(e) { return null; }
  }, [gold, curr, param.key, h]);

  // Compute GP violation point
  const gpViolation = React.useMemo(() => {
    if (!gold || !curr || gold.length < 3) return null;
    const testTimes = curr.map(r=>r.time_hours).filter(t=>t!=null&&!isNaN(t));
    try {
      const bands = buildGPBands(gold, testTimes, param.key);
      return checkGPViolation(curr, bands, param.key, gold);
    } catch(e) { return null; }
  }, [gold, curr, param.key]);
  const W=680,PAD={t:12,r:14,b:28,l:46};
  const cw=W-PAD.l-PAD.r,ch=h-PAD.t-PAD.b;
  const all=[...(curr||[]),...(gold||[])];
  const tVals=all.map(r=>r.time_hours).filter(v=>v!=null&&!isNaN(v));
  const vVals=all.map(r=>r[param.key]).filter(v=>v!=null&&!isNaN(v));
  if(!tVals.length||!vVals.length)return null;
  const tMin=Math.min(...tVals),tMax=Math.max(...tVals);
  const yMin=param.yMin!=null?param.yMin:Math.min(...vVals)*0.92;
  const yMax=param.yMax!=null?param.yMax:Math.max(...vVals)*1.08;
  const tx=t=>PAD.l+((t-tMin)/((tMax-tMin)||1))*cw;
  const ty=v=>PAD.t+ch-((v-yMin)/((yMax-yMin)||1))*ch;
  const mkPath=data=>{
    if(!data||!data.length)return"";
    return data.filter(r=>r[param.key]!=null&&!isNaN(r[param.key])).map((r,i)=>`${i===0?"M":"L"}${tx(r.time_hours).toFixed(1)},${ty(r[param.key]).toFixed(1)}`).join(" ");
  };
  const xTicks=[],step=Math.ceil((tMax-tMin)/6)||1;
  for(let t=tMin;t<=tMax;t+=step)xTicks.push(t);
  const yTicks=[];for(let i=0;i<=5;i++)yTicks.push(yMin+(yMax-yMin)/5*i);
  const wv=param.warnLow!=null?param.warnLow:param.warnHigh;
  const cv2=param.critLow!=null?param.critLow:param.critHigh;
  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:4,padding:"14px 16px",marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span style={{fontSize:15,fontWeight:700,color:C.text}}>{param.label}{param.unit?" ("+param.unit+")":""}</span>
        <div style={{display:"flex",gap:20}}>
          {gold&&<span style={{fontSize:12,color:C.golden}}>— Reference Batch</span>}
          {curr&&<span style={{fontSize:12,color:C.current}}>— Current Run</span>}
          {wv!=null&&<span style={{fontSize:12,color:C.warn}}>- - Warn</span>}
          {cv2!=null&&<span style={{fontSize:12,color:C.critical}}>- - Critical</span>}
        </div>
      </div>
      <svg width="100%" viewBox={"0 0 "+W+" "+h} style={{display:"block"}}>
        {yTicks.map((v,i)=>(
          <g key={i}>
            <line x1={PAD.l} y1={ty(v)} x2={W-PAD.r} y2={ty(v)} stroke={C.grid} strokeWidth="1"/>
            <text x={PAD.l-8} y={ty(v)+4} textAnchor="end" fill={C.label} fontSize="11" fontFamily="Arial">{v<1?v.toFixed(2):v<10?v.toFixed(1):Math.round(v)}</text>
          </g>
        ))}
        {xTicks.map((t,i)=>(
          <g key={i}>
            <line x1={tx(t)} y1={PAD.t} x2={tx(t)} y2={h-PAD.b} stroke={C.grid} strokeWidth="1"/>
            <text x={tx(t)} y={h-PAD.b+16} textAnchor="middle" fill={C.label} fontSize="11" fontFamily="Arial">{t}h</text>
          </g>
        ))}
        {wv!=null&&<line x1={PAD.l} y1={ty(wv)} x2={W-PAD.r} y2={ty(wv)} stroke={C.warn} strokeWidth="1.5" strokeDasharray="5 3" opacity="0.8"/>}
        {cv2!=null&&<line x1={PAD.l} y1={ty(cv2)} x2={W-PAD.r} y2={ty(cv2)} stroke={C.critical} strokeWidth="1.5" strokeDasharray="5 3" opacity="0.8"/>}
        {divHour!=null&&tx(divHour)>PAD.l&&(
          <g>
            <line x1={tx(divHour)} y1={PAD.t} x2={tx(divHour)} y2={h-PAD.b} stroke={C.warn} strokeWidth="1.5" strokeDasharray="4 3" opacity="0.7"/>
            <text x={tx(divHour)+5} y={PAD.t+14} fill={C.warn} fontSize="11" fontFamily="Arial">diverge</text>
          </g>
        )}
        {/* GP confidence band — rendered before lines so lines appear on top */}
        {gpBandPath&&gpBandPath.area&&<path d={gpBandPath.area} fill={C.golden} fillOpacity="0.08" stroke="none"/>}
        {gpBandPath&&gpBandPath.upper&&<path d={gpBandPath.upper} fill="none" stroke={C.golden} strokeWidth="1" strokeDasharray="3 3" opacity="0.4"/>}
        {gpBandPath&&gpBandPath.lower&&<path d={gpBandPath.lower} fill="none" stroke={C.golden} strokeWidth="1" strokeDasharray="3 3" opacity="0.4"/>}
        {/* GP violation marker */}
        {gpViolation&&tx(gpViolation.hour)>PAD.l&&(
          <g>
            <circle cx={tx(gpViolation.hour)} cy={ty(gpViolation.value)} r="4" fill={C.warn} opacity="0.9"/>
            <line x1={tx(gpViolation.hour)} y1={PAD.t} x2={tx(gpViolation.hour)} y2={h-PAD.b} stroke={C.warn} strokeWidth="1" strokeDasharray="3 3" opacity="0.6"/>
            <text x={tx(gpViolation.hour)+6} y={PAD.t+22} fill={C.warn} fontSize="10" fontFamily="Arial" fontWeight="600">{"GP exit Hr "+gpViolation.hour}</text>
          </g>
        )}
        {gold&&mkPath(gold)&&<path d={mkPath(gold)} fill="none" stroke={C.golden} strokeWidth="1.5" strokeDasharray="7 4" opacity="0.7"/>}
        {curr&&mkPath(curr)&&<path d={mkPath(curr)} fill="none" stroke={C.current} strokeWidth="2.5"/>}
        <line x1={PAD.l} y1={PAD.t} x2={PAD.l} y2={h-PAD.b} stroke={C.border} strokeWidth="1"/>
        <line x1={PAD.l} y1={h-PAD.b} x2={W-PAD.r} y2={h-PAD.b} stroke={C.border} strokeWidth="1"/>
      </svg>
    </div>
  );
}

function APQPanel({org,curr,gold,params,alerts,divHour,orgId}){
  const [running,  setRunning]  = React.useState(false);
  const [apqLog,   setApqLog]   = React.useState([]);
  const [lastRes,  setLastRes]  = React.useState(null);
  const [showLog,  setShowLog]  = React.useState(false);

  const runAPQ = async () => {
    if(!curr||running)return;
    setRunning(true);
    const last=curr[curr.length-1];
    const runHour=last.time_hours;
    const runPct=Math.round((runHour/(org?org.duration:240))*100);
    const gMap={};if(gold)gold.forEach(r=>{gMap[r.time_hours]=r;});
    const gLast=gMap[runHour];

    const paramSummary=params.map(p=>{
      const val=last[p.key];
      const gv=gLast?gLast[p.key]:null;
      const pct=(val!=null&&gv!=null&&!isNaN(val)&&!isNaN(gv))?Math.round(Math.abs((val-gv)/(Math.abs(gv)+0.001))*100):0;
      return p.label+": current="+(typeof val==="number"?val.toFixed(2):val)+" golden="+(gv!=null?Number(gv).toFixed(2):"N/A")+" deviation="+pct+"%";
    }).join("\n");

    const activeAlerts=alerts.map(a=>a.level+": "+a.text.substring(0,80)).join("\n")||"None";
    const divInfo=divHour&&divHour.hour!=null?"Divergence detected at Hour "+divHour.hour+" on: "+divHour.details.map(d=>d.label).join(", "):"No divergence detected";

    const prompt="You are the Adaptive Process Qualification agent for Kinetra Bio Engine v5.9.8.\n\nCurrent process state:\n- Organism: "+(org?org.label:"Unknown")+"\n- Run hour: "+runHour+" of "+(org?org.duration:240)+" ("+runPct+"% complete)\n- Active alerts: "+activeAlerts+"\n- Divergence status: "+divInfo+"\n- Parameters:\n"+paramSummary+"\n\nGenerate a targeted APQ challenge for this specific process state. Identify the ONE most important failure mode to test right now based on what you observe.\n\nRespond ONLY with valid JSON, no other text:\n{\"challenge_name\":\"short name\",\"target_parameter\":\"parameter name\",\"failure_mode\":\"failure mode\",\"rationale\":\"one sentence why this challenge is relevant now\",\"scenario\":\"brief description of synthetic deviation scenario\",\"verdict\":\"PASS\",\"confidence\":\"HIGH or MEDIUM or LOW\"}";

    // INTELLIGENT FALLBACK — contextually driven by actual process state
    // Analyzes which parameter is most deviated, which failure mode is most
    // relevant at this run stage, and generates a specific targeted challenge.
    // No API call required — runs fully offline.
    try {
      // Step 1 — Find the most deviated parameter relative to golden batch
      let worstParam = null, worstPct = 0, worstVal = null, worstGv = null;
      params.forEach(p => {
        const val = last[p.key];
        const gv = gLast ? gLast[p.key] : null;
        if (val==null||gv==null||isNaN(val)||isNaN(gv)) return;
        const pct = Math.round(Math.abs((val-gv)/(Math.abs(gv)+0.001))*100);
        if (pct > worstPct) { worstPct=pct; worstParam=p; worstVal=val; worstGv=gv; }
      });

      // Step 2 — Determine run stage
      const stage = runPct < 25 ? "early" : runPct < 60 ? "mid" : runPct < 85 ? "late" : "terminal";

      // Step 3 — Identify primary failure mode for this organism and stage
      const failureModeMap = {
        cho: {

// EVIDENCE RECORD — first illustrative implementation (prototype scope,
// see PDIPanel usage site for full scope note). Ported directly from a
// Python version validated against real CHO golden/DO-crisis data before
// this UI wiring was written.
// ═══════════════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════════
// EVIDENCE RECORD — Bacillus Premature Sporulation Scenario (prototype scope)
//
// SCENARIO: The ambiguous early window (hours 9-15) where sporulation_index
// and glucose are both diverging from golden, but it's genuinely unclear
// whether this represents premature sporulation (yield loss incoming) or a
// kinetically faster batch (healthy, just ahead of schedule). The
// discriminating insight is the sporulation_index:OD600 RATIO — if
// sporulation is rising disproportionately to growth, that's a stress signal
// no univariate check can see.
//
// SCOPE NOTE: same transparent weighted-heuristic approach as the CHO record.
// Not a validated Bayesian network. Not a production-grade causal inference
// system. The structure and direction are grounded in established Bacillus
// sporulation biology; the weights are illustrative.
// ═══════════════════════════════════════════════════════════════════════════
function computeBacillusEvidenceRecord(data, golden, runHour) {
  const REQUIRED = ["sporulation_index","glucose_mM","OD600","protease_activity_U_mL","pH"];
  const goldenMap = {}; golden.forEach(r => { goldenMap[r.time_hours] = r; });
  const priorHour = runHour - 6;
  const g = goldenMap[runHour], c = data.find(r => r.time_hours === runHour);
  const gp = goldenMap[priorHour], cp = data.find(r => r.time_hours === priorHour);
  if (!g || !c || !gp || !cp) return null;
  for (const key of REQUIRED) {
    if (g[key] == null || c[key] == null) return null;
  }

  const pctChange = key => { const gv=g[key],cv=c[key]; return gv!==0?(cv-gv)/gv:0; };
  const sporChange = pctChange("sporulation_index");
  const glucChange = pctChange("glucose_mM");
  const od600Change = pctChange("OD600");
  const proteaseChange = pctChange("protease_activity_U_mL");
  const phChange = pctChange("pH");

  // Only surface when there's a real signal — sporulation AND glucose both moving
  if (Math.abs(sporChange) < 0.10 || glucChange > -0.05) return null;

  // Key discriminating ratio: sporulation_index / OD600
  const sporOdRatioCurrent = c.OD600 > 0 ? c.sporulation_index / c.OD600 : null;
  const sporOdRatioGolden = g.OD600 > 0 ? g.sporulation_index / g.OD600 : null;
  const ratioDeviation = (sporOdRatioCurrent != null && sporOdRatioGolden != null && sporOdRatioGolden !== 0)
    ? (sporOdRatioCurrent - sporOdRatioGolden) / sporOdRatioGolden : 0;

  const hypotheses = [];

  // Hypothesis A: Premature sporulation — nutrient stress
  let aSupport = 0; const aFor = [], aAgainst = [];
  if (glucChange < -0.08) { aSupport += 0.3; aFor.push(`Glucose depleting ${Math.round(Math.abs(glucChange)*100)}% faster than golden — nutrient stress is a plausible driver`); }
  if (sporChange > 0.15) { aSupport += 0.25; aFor.push(`Sporulation index elevated ${Math.round(sporChange*100)}% above golden at this hour`); }
  if (ratioDeviation > 0.10) { aSupport += 0.3; aFor.push(`Sporulation:OD600 ratio is ${Math.round(ratioDeviation*100)}% above golden — cells sporulating disproportionately to growth, consistent with a stress trigger rather than proportional healthy kinetics`); }
  if (phChange < -0.005) { aSupport += 0.1; aFor.push(`pH trending slightly lower than golden — acidic drift can independently accelerate sporulation onset`); }
  if (od600Change > 0.15) aAgainst.push("OD600 also elevated — growth rate is higher, which is consistent with a kinetically faster batch (Hypothesis B) as well as early-log nutrient stress");
  hypotheses.push({ hypothesis: "Premature sporulation driven by nutrient stress — yield loss likely if sporulation:OD600 ratio continues rising past hour " + (runHour+6), support: Math.min(aSupport, 0.95), evidence_for: aFor, evidence_against: aAgainst });

  // Hypothesis B: Kinetically faster batch (healthy)
  let bSupport = 0; const bFor = [], bAgainst = [];
  if (od600Change > 0.1) { bSupport += 0.3; bFor.push(`OD600 elevated ${Math.round(od600Change*100)}% — faster growth is consistent with a richer inoculum or slightly better aeration on this run`); }
  if (proteaseChange > 0 && proteaseChange < 0.25) { bSupport += 0.15; bFor.push("Protease activity tracking proportionally with growth — not outrunning OD600, which would suggest early stress response"); }
  if (ratioDeviation <= 0.10) { bSupport += 0.25; bFor.push("Sporulation:OD600 ratio within 10% of golden — sporulation proportional to growth, not disproportionate"); }
  else bAgainst.push(`Sporulation:OD600 ratio is ${Math.round(ratioDeviation*100)}% above golden — disproportionate sporulation is harder to explain as a simple kinetic shift alone`);
  hypotheses.push({ hypothesis: "Kinetically faster batch on a richer inoculum — elevated sporulation is proportional to elevated growth, not a stress indicator", support: Math.min(bSupport, 0.95), evidence_for: bFor, evidence_against: bAgainst });

  // Hypothesis C: pH-mediated acceleration
  let cSupport = 0.05; const cFor = [], cAgainst = [];
  if (phChange < -0.01) { cSupport += 0.2; cFor.push(`pH declining ${Math.round(Math.abs(phChange)*100)}% vs golden — acidic conditions can independently trigger early sporulation commitment`); }
  else cAgainst.push("pH is not meaningfully lower than golden at this hour — pH-mediated acceleration is unlikely as the primary driver");
  hypotheses.push({ hypothesis: "pH-mediated stress acceleration — acidic drift is independently triggering early sporulation commitment", support: Math.min(cSupport, 0.95), evidence_for: cFor, evidence_against: cAgainst });

  const total = hypotheses.reduce((s,h) => s+h.support, 0);
  hypotheses.forEach(h => { h.normalized_support = total>0 ? h.support/total : 0; });
  hypotheses.sort((a,b) => b.normalized_support - a.normalized_support);

  return {
    trigger: `Sporulation index and glucose both diverging from golden at hour ${runHour} — ambiguous early signal`,
    hypotheses,
    next_discriminating_evidence: `Compute the sporulation_index:OD600 ratio at hours ${runHour+3} and ${runHour+6}. If the ratio CONTINUES to rise disproportionately while glucose keeps depleting, Hypothesis A (nutrient stress) gains strong support and corrective action should be considered. If the ratio stabilizes and both parameters track golden's shape with a consistent offset, Hypothesis B (kinetically faster batch) is the more likely explanation and no intervention is needed.`,
    decision_status: hypotheses[0].normalized_support < 0.75
      ? "Intervention not yet warranted — monitor sporulation:OD600 ratio at next two timepoints before acting"
      : "Primary hypothesis gaining support — continue monitoring, prepare contingency",
  };
}


function computeCARTEvidenceRecord(data, golden, runHour) {
  // Only surface when viability is deviating AND run is past activation window (>48h)
  if (runHour < 48) return null;
  const g = golden ? golden.find(r => Math.abs(r.time_hours - runHour) < 12) : null;
  const c = data.find(r => r.time_hours === runHour);
  if (!g || !c) return null;
  if (c.viability_percent == null || g.viability_percent == null) return null;

  const viabDelta = c.viability_percent - g.viability_percent;
  const lactateDelta = (c.lactate_mM != null && g.lactate_mM != null) ? c.lactate_mM - g.lactate_mM : null;
  const densityPct = (c.cell_density_E6_per_mL != null && g.cell_density_E6_per_mL != null && g.cell_density_E6_per_mL > 0)
    ? (c.cell_density_E6_per_mL - g.cell_density_E6_per_mL) / g.cell_density_E6_per_mL : null;
  const foldDelta = (c.fold_expansion != null && g.fold_expansion != null) ? c.fold_expansion - g.fold_expansion : null;

  // Only surface if viability is meaningfully below golden
  if (viabDelta > -5) return null;

  const hypotheses = [];

  // Hypothesis A: Activation failure
  let aSupport = 0; const aFor = [], aAgainst = [];
  if (viabDelta < -10) { aSupport += 0.3; aFor.push(`Viability ${Math.round(Math.abs(viabDelta))}% below reference batch — progressive decline consistent with activation failure`); }
  if (foldDelta != null && foldDelta < -50 && runHour > 120) { aSupport += 0.35; aFor.push(`Fold expansion lagging reference batch by ${Math.round(Math.abs(foldDelta))}x — cells not responding to activation stimulus`); }
  if (lactateDelta != null && lactateDelta < 3) { aSupport += 0.1; aFor.push("Lactate not elevated — not a metabolic crisis, consistent with low expansion rather than active cell death"); }
  if (lactateDelta != null && lactateDelta > 5) aAgainst.push("Elevated lactate suggests active metabolic stress rather than quiet activation failure");
  hypotheses.push({ hypothesis: "Activation failure — T-cells not responding to activation stimulus", support: Math.min(aSupport, 0.95), evidence_for: aFor, evidence_against: aAgainst });

  // Hypothesis B: Contamination
  let bSupport = 0; const bFor = [], bAgainst = [];
  if (lactateDelta != null && lactateDelta > 5) { bSupport += 0.35; bFor.push(`Lactate ${Math.round(lactateDelta)}mM above reference batch — metabolic disturbance consistent with contaminant growth`); }
  if (viabDelta < -15) { bSupport += 0.25; bFor.push("Rapid viability decline — faster than typical activation failure kinetics"); }
  if (lactateDelta != null && lactateDelta < 3) bAgainst.push("Lactate not elevated — contamination typically drives rapid lactate accumulation");
  hypotheses.push({ hypothesis: "Contamination event — microbial or cross-cell contamination driving viability collapse", support: Math.min(bSupport, 0.95), evidence_for: bFor, evidence_against: bAgainst });

  // Hypothesis C: Media lot variability
  let cSupport = 0.1; const cFor = [], cAgainst = [];
  if (densityPct != null && densityPct < -0.20) { cSupport += 0.2; cFor.push(`Cell density ${Math.round(Math.abs(densityPct)*100)}% below reference batch — may reflect lot-to-lot variation in growth factor concentrations`); }
  cFor.push("Media lot variability (cytokines, growth factors, amino acid profile) is a documented cause of inconsistent CAR-T expansion");
  cFor.push("Compare current media lot certificate against reference batch lot — osmolality and glutamine concentration are key discriminating values");
  hypotheses.push({ hypothesis: "Media lot variability — current lot composition differs from reference batch lot", support: Math.min(cSupport, 0.95), evidence_for: cFor, evidence_against: cAgainst });

  const total = hypotheses.reduce((s,h) => s+h.support, 0);
  hypotheses.forEach(h => { h.normalized_support = total>0 ? h.support/total : 0; });
  hypotheses.sort((a,b) => b.normalized_support - a.normalized_support);

  return {
    trigger: `Viability ${Math.round(Math.abs(viabDelta))}% below reference batch at hour ${runHour} — ambiguous early signal`,
    hypotheses,
    next_discriminating_evidence: "Check contamination indicators (sterility, off-odor, turbidity). Compare media lot certificate (osmolality, glutamine) against reference batch lot. If contamination excluded, assess activation markers (CD25, CD69 if available) to distinguish activation failure from media variability.",
    decision_status: hypotheses[0].normalized_support < 0.65
      ? "Evidence split between hypotheses — contamination must be excluded before proceeding"
      : "Primary hypothesis gaining support — confirm contamination status immediately",
  };
}

function computeEvidenceRecord(data, golden, runHour) {
  const REQUIRED = ["pH", "DO_percent", "lactate_mM", "pCO2_mmHg", "glucose_mM"];
  const goldenMap = {}; golden.forEach(r => { goldenMap[r.time_hours] = r; });
  const priorHour = runHour - 12;
  const g = goldenMap[runHour], c = data.find(r => r.time_hours === runHour);
  const gp = goldenMap[priorHour], cp = data.find(r => r.time_hours === priorHour);
  if (!g || !c || !gp || !cp) return null;
  for (const key of REQUIRED) {
    if (g[key] == null || c[key] == null || gp[key] == null || cp[key] == null) return null;
  }

  const pctChange = (key) => { const gv = g[key], cv = c[key]; return gv !== 0 ? (cv - gv) / gv : 0; };
  const doChange = pctChange("DO_percent");
  const lactateChange = pctChange("lactate_mM");
  const pco2Change = pctChange("pCO2_mmHg");
  const glucoseChange = pctChange("glucose_mM");
  const doPriorChange = (c.DO_percent - cp.DO_percent) / cp.DO_percent;
  const lactatePriorChange = (c.lactate_mM - cp.lactate_mM) / Math.max(cp.lactate_mM, 0.1);

  // Only surface this when there's an actual meaningful deviation to reason about
  if (Math.abs(doChange) < 0.1 && Math.abs(lactateChange) < 0.1 && Math.abs(pco2Change) < 0.1) return null;

  const hypotheses = [];

  // Hypothesis A: DO/oxygen-transfer limitation is root cause
  let doSupport = 0; const doFor = [], doAgainst = [];
  if (doChange < -0.15) { doSupport += 0.4; doFor.push(`DO down ${Math.round(doChange*100)}% vs golden at this hour`); }
  if (doPriorChange < -0.1) { doSupport += 0.25; doFor.push(`DO already declining ${Math.round(doPriorChange*100)}% in the prior 12h window — moved before lactate/pH deviation became pronounced`); }
  if (pco2Change > 0.10) { doSupport += 0.2; doFor.push(`pCO2 elevated ${Math.round(pco2Change*100)}% — consistent with reduced gas-transfer efficiency under DO-limited conditions, not just metabolic production`); }
  if (glucoseChange < 0.1) doFor.push("glucose trajectory not showing accelerated consumption — argues against a simple overgrowth/overfeeding explanation for the lactate rise");
  else doAgainst.push("glucose consumption also elevated — can't fully rule out a growth-driven demand spike");
  hypotheses.push({ hypothesis: "DO/oxygen-transfer limitation is the primary driver; lactate and pCO2 rises are downstream consequences", support: Math.min(doSupport, 0.95), evidence_for: doFor, evidence_against: doAgainst });

  // Hypothesis B: primary metabolic/feed-driven lactate overproduction
  let metaSupport = 0; const metaFor = [], metaAgainst = [];
  if (lactateChange > 0.15) { metaSupport += 0.3; metaFor.push(`Lactate elevated ${Math.round(lactateChange*100)}% vs golden at this hour`); }
  if (lactatePriorChange > doPriorChange) metaAgainst.push("Lactate's own rate of change in the prior window did not lead DO's decline — timing favors DO as the earlier-moving signal");
  else metaSupport += 0.1;
  hypotheses.push({ hypothesis: "A primary metabolic shift (e.g. feed-driven overflow metabolism) is the root cause; DO drop is a secondary consequence of increased oxygen demand", support: Math.min(metaSupport, 0.95), evidence_for: metaFor, evidence_against: metaAgainst });

  // Hypothesis C: isolated sensor fault
  hypotheses.push({ hypothesis: "Isolated sensor/measurement fault, not a real process deviation", support: 0.05, evidence_for: [], evidence_against: ["DO, lactate, pCO2, and pH are ALL deviating together in a physiologically consistent direction — a single-sensor fault would typically show one parameter behaving anomalously while others remain normal, not four moving in a coherent pattern"] });

  const total = hypotheses.reduce((s, h) => s + h.support, 0);
  hypotheses.forEach(h => { h.normalized_support = total > 0 ? h.support / total : 0; });
  hypotheses.sort((a, b) => b.normalized_support - a.normalized_support);

  return {
    trigger: `pH diverging from golden (${g.pH} → ${c.pH}), multiple correlated signals at hour ${runHour}`,
    hypotheses,
    next_discriminating_evidence: "Reconcile kLa (oxygen transfer coefficient) / agitation-sparge log against reference batch's own kLa at this hour. If kLa itself has dropped (e.g. sparger fouling, agitation fault), that directly confirms Hypothesis A's mechanism rather than inferring it indirectly from DO/pCO2 correlation.",
    decision_status: hypotheses[0].normalized_support < 0.8 ? "insufficient evidence for automated intervention recommendation — surfaced for MSAT review" : "primary hypothesis strongly supported",
  };
}

function PDIPanel({orgId, data, golden, params, alerts, divHour, archive, goldName, currName, mediaLot}) {
  const result = calcBayesian(orgId, data, golden, params, alerts, divHour, archive);
  const [showLog, setShowLog] = React.useState(false);
  if (!result) return null;

  // Primary signal — the single most important finding
  // Order of priority: critical alert > GP band exit > trajectory acceleration > divergence
  // ─────────────────────────────────────────────────────────────────────────
  // Monitoring-only parameter filtering for Primary Signal selection.
  //
  // WHY: parameters on the GP_BAND_UNVALIDATED list, before real batch
  // calibration exists (nBatches<=1), false-flag at documented high rates
  // (pH 50-95%, viability up to 74%, etc. — measured this session). Letting
  // that noise win the Primary Signal headline slot erodes trust in the tool
  // as a whole, even though the underlying detection is working as designed.
  //
  // WHY NOT JUST SUPPRESS THEM: pH/viability/temperature CAN be the first
  // real signal of a genuine fault. Blanket-suppressing them by parameter
  // identity would bury real early warnings on exactly the parameters most
  // likely to carry one. So this filters by BEHAVIOR, not identity:
  //   - Escalation override: if the SAME parameter also shows up as
  //     "accelerating" / "declining faster" / "rising faster" elsewhere in
  //     the evidence (the trajectory/acceleration layers already built),
  //     that's a real, worsening pattern -- not isolated noise. Eligible.
  //   - Corroboration override: if OTHER parameters are ALSO deviating at
  //     the same hour, that's evidence against a single noisy parameter and
  //     for a real, multi-signal event. Eligible.
  //   - Otherwise: stays fully visible in the evidence log (never hidden),
  //     just not eligible for the headline Primary Signal slot.
  const isMonitoringOnly = (evidenceText) => evidenceText.includes("[UNVALIDATED BAND");

  const extractHour = (evidenceText) => {
    const m = evidenceText.match(/Hour (\d+(?:\.\d+)?)/);
    return m ? parseFloat(m[1]) : null;
  };
  const extractLabel = (evidenceText) => evidenceText.split(" exits GP confidence band")[0];

  const isEscalating = (evidenceText, allEvidence) => {
    const label = extractLabel(evidenceText);
    return allEvidence.some(e => e !== evidenceText && e.startsWith(label) &&
      (e.includes("accelerating") || e.includes("declining faster") || e.includes("rising faster")));
  };
  const isCorroborated = (evidenceText, allEvidence) => {
    const hour = extractHour(evidenceText);
    const label = extractLabel(evidenceText);
    if (hour == null) return false;
    // Corroboration only counts if at least one corroborating parameter is itself
    // NOT monitoring-only. Mutual corroboration between unvalidated parameters
    // (e.g. pH + glucose + DO all noisy at hour 0) is noise corroborating noise,
    // not evidence of a real signal. A real multi-parameter event will include at
    // least one parameter not on the unvalidated list.
    const corroboratingNonMonitoringOnly = allEvidence.filter(e =>
      e !== evidenceText &&
      e.includes("Hour " + hour) &&
      extractLabel(e) !== label &&
      !isMonitoringOnly(e)
    );
    return corroboratingNonMonitoringOnly.length >= 1;
  };
  const isPrimaryEligible = (evidenceText, allEvidence) => {
    if (!isMonitoringOnly(evidenceText)) return true; // fully calibrated or not on the unvalidated list at all
    return isEscalating(evidenceText, allEvidence) || isCorroborated(evidenceText, allEvidence);
  };
  // ─────────────────────────────────────────────────────────────────────────

  const primarySignal = (() => {
    const crits = alerts.filter(a=>a.level==="CRITICAL");
    if (crits.length > 0) return { text: crits[0].text.split(".")[0] + ".", fallback: false };
    const warns = alerts.filter(a=>a.level==="WARN");
    const gpEvidence = result.evidence.find(e=>e.includes("GP confidence band") && isPrimaryEligible(e, result.evidence));
    if (gpEvidence) return { text: gpEvidence, fallback: false };
    const accelEvidence = result.evidence.find(e=>e.includes("accelerating"));
    if (accelEvidence) return { text: accelEvidence, fallback: false };
    if (warns.length > 0) return { text: warns[0].text.split(".")[0] + ".", fallback: false };
    const divEvidence = result.evidence.find(e=>e.includes("Divergence"));
    if (divEvidence) return { text: divEvidence, fallback: false };
    // Nothing primary-eligible found — fall back to the first monitoring-only
    // GP evidence rather than showing nothing, but mark as fallback so the
    // render block can use neutral styling instead of alarm colors.
    const monitoringOnlyGp = result.evidence.find(e=>e.includes("GP confidence band"));
    if (monitoringOnlyGp) return { text: monitoringOnlyGp, fallback: true };
    return null;
  })();

  // Supporting signals — next 3 most significant, excluding primary
  const supportingSignals = (() => {
    const all = [];
    alerts.filter(a=>a.level==="CRITICAL").slice(1).forEach(a=>all.push(a.text.split(".")[0]));
    alerts.filter(a=>a.level==="WARN").forEach(a=>all.push(a.text.split(".")[0]));
    result.evidence.filter(e=>primarySignal&&!e.includes(primarySignal.text.substring(0,20))).slice(0,6).forEach(e=>all.push(e));
    return [...new Set(all)].slice(0,3);
  })();

  const barWidth = result.pdi + "%";
  const baselineWidth = result.baseline + "%";

  return (
    <div style={{background:C.panel,border:"1px solid "+result.riskColor,borderRadius:4,padding:"16px 18px",marginBottom:10}}>

      {/* PDI score + status */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:2,color:result.riskColor,marginBottom:3}}>PROCESS DEVIATION INDEX</div>
          <div style={{fontSize:10,color:C.label}}>Hour {result.runHour} · {result.stage} stage · {result.likelihood}x evidence weight</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:36,fontWeight:300,color:result.riskColor,lineHeight:1,letterSpacing:-1}}>{result.pdi}<span style={{fontSize:14,color:C.label,fontWeight:400}}>/100</span></div>
          <div style={{fontSize:11,fontWeight:700,color:result.riskColor,letterSpacing:1,marginTop:2}}>{result.riskLevel}</div>
        </div>
      </div>

      {result.usingUncalibratedBaseline && (
        <div style={{background:"rgba(234,179,8,0.08)",border:"1px solid "+C.warn,borderRadius:4,padding:"8px 12px",marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:C.warn}}>⚠ No calibrated baseline for this organism</div>
          <div style={{fontSize:10,color:C.label,marginTop:2}}>Using a generic, uncalibrated risk curve — not tuned to this organism's actual failure dynamics. Add an entry to PDI_BASELINE before trusting this PDI for real decisions.</div>
        </div>
      )}

      {/* Progress bar — baseline vs current */}
      <div style={{marginBottom:14}}>
        <div style={{background:C.card,borderRadius:2,height:4,position:"relative",overflow:"hidden"}}>
          <div style={{position:"absolute",left:0,top:0,height:"100%",width:baselineWidth,background:C.dim,opacity:0.35}}/>
          <div style={{position:"absolute",left:0,top:0,height:"100%",width:barWidth,background:result.riskColor,opacity:0.85,transition:"width 0.5s"}}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:C.dim,marginTop:4}}>
          <span>Baseline {result.baseline}</span>
          <span>Literature-calibrated · Facility-calibrated during validation engagement</span>
        </div>
      </div>

      {/* Primary signal — uses alarm colors for real corroborated signals,
          neutral grey for fallback (monitoring-only noise, no corroboration).
          The distinction matters: a user should never mistake the fallback
          path for a confirmed alert. */}
      {primarySignal&&(
        <div style={{
          background: primarySignal.fallback ? "rgba(100,100,100,0.06)" : (result.pdi>=70?"rgba(239,68,68,0.08)":result.pdi>=40?"rgba(234,179,8,0.08)":"rgba(251,146,60,0.06)"),
          borderLeft: "3px solid " + (primarySignal.fallback ? "#888888" : result.riskColor),
          borderRadius:"0 4px 4px 0",padding:"10px 12px",marginBottom:10
        }}>
          <div style={{fontSize:10,fontWeight:700,color:primarySignal.fallback?"#888888":result.riskColor,letterSpacing:1,marginBottom:4}}>
            {primarySignal.fallback ? "MONITORING — no corroborated signal at this hour" : "PRIMARY SIGNAL"}
          </div>
          <div style={{fontSize:13,color:primarySignal.fallback?C.dim:C.text,lineHeight:1.6,fontWeight:primarySignal.fallback?400:500}}>{primarySignal.text}</div>
        </div>
      )}

      {/* Supporting signals — 3 max */}
      {supportingSignals.length>0&&(
        <div style={{marginBottom:10}}>
          {supportingSignals.map((s,i)=>(
            <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start",padding:"4px 0",borderBottom:i<supportingSignals.length-1?"1px solid "+C.border:"none"}}>
              <span style={{color:result.riskColor,fontSize:11,flexShrink:0,marginTop:1}}>{">"}</span>
              <span style={{fontSize:12,color:C.label,lineHeight:1.5}}>{s}</span>
            </div>
          ))}
        </div>
      )}

      {/* Evidence log toggle */}
      {result.evidence.length>0&&(
        <div>
          <button onClick={()=>setShowLog(v=>!v)} style={{fontSize:11,color:C.dim,background:"transparent",border:"none",cursor:"pointer",padding:0,textDecoration:"underline",letterSpacing:0.3}}>
            {showLog?"Hide":"View"} full evidence log ({result.evidence.length} items)
          </button>
          {showLog&&(
            <div style={{marginTop:8,padding:"10px 12px",background:C.card,borderRadius:4}}>
              <div style={{fontSize:10,fontWeight:700,color:C.label,letterSpacing:1,marginBottom:8}}>AUDIT TRAIL — EVIDENCE LOG</div>
              {result.evidence.map((e,i)=>(
                <div key={i} style={{fontSize:11,color:C.dim,marginBottom:4,paddingLeft:10,position:"relative",lineHeight:1.5}}>
                  <span style={{position:"absolute",left:0,color:C.dim}}>·</span>{e}
                </div>
              ))}
              <div style={{fontSize:10,color:C.dim,marginTop:8,paddingTop:6,borderTop:"1px solid "+C.border}}>
                Literature-calibrated · Facility-calibrated during validation engagement · Kinetra Engine v5.9.8
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── MEDIA LOT HYPOTHESIS ── */}
      {mediaLot && mediaLot.currentLot && mediaLot.referenceLot &&
       mediaLot.currentLot !== mediaLot.referenceLot &&
       result.evidence.length > 0 && (
        <div style={{marginBottom:10,padding:"8px 12px",background:"rgba(232,168,56,0.06)",border:"1px solid rgba(232,168,56,0.25)",borderRadius:4}}>
          <div style={{fontSize:10,fontWeight:700,color:C.warn,letterSpacing:1.2,marginBottom:4}}>MEDIA LOT HYPOTHESIS</div>
          <div style={{fontSize:12,color:C.text,marginBottom:4}}>
            Deviation is consistent with known media lot variability — current lot ({mediaLot.currentLot}) differs from reference batch lot ({mediaLot.referenceLot}).
          </div>
          <div style={{fontSize:11,color:C.dim}}>
            Check lot certificate against reference batch lot before initiating a process investigation.
          </div>
        </div>
      )}

      {/* Evidence log toggle */}
      {result.evidence.length>0&&(
        <div>
          <button onClick={()=>setShowLog(v=>!v)} style={{fontSize:11,color:C.dim,background:"transparent",border:"none",cursor:"pointer",padding:0,textDecoration:"underline",letterSpacing:0.3}}>
            {showLog?"Hide":"View"} full evidence log ({result.evidence.length} items)
          </button>
          {showLog&&(
            <div style={{marginTop:8,padding:"10px 12px",background:C.card,borderRadius:4}}>
              <div style={{fontSize:10,fontWeight:700,color:C.label,letterSpacing:1,marginBottom:8}}>AUDIT TRAIL — EVIDENCE LOG</div>
              {result.evidence.map((e,i)=>(
                <div key={i} style={{fontSize:11,color:C.dim,marginBottom:4,paddingLeft:10,position:"relative",lineHeight:1.5}}>
                  <span style={{position:"absolute",left:0,color:C.dim}}>·</span>{e}
                </div>
              ))}
              <div style={{fontSize:10,color:C.dim,marginTop:8,paddingTop:6,borderTop:"1px solid "+C.border}}>
                Literature-calibrated · Facility-calibrated during validation engagement · Kinetra Engine v5.9.8
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── Export / Print Report ─────────────────────────────────────────── */}
      {(() => {
        const org = ORGANISMS.find(o=>o.id===orgId);
        const orgName = org ? org.label : orgId;
        const exportReport = () => {
          const ts = new Date().toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"});
          const printWindow = window.open("","_blank","width=900,height=700");
          const psText = primarySignal ? primarySignal.text : "(no primary signal)";
          const psLabel = primarySignal && primarySignal.fallback ? "MONITORING — no corroborated signal" : "PRIMARY SIGNAL";
          const psColor = primarySignal && primarySignal.fallback ? "#667" : result.riskColor;
          const evidenceHTML = result.evidence.map(e=>`<li>${e}</li>`).join("");
          printWindow.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Kinetra Bio — Analysis Report</title><style>

            h1{font-size:22px;font-weight:700;color:#0E1B21;margin-bottom:2px;}
            .subtitle{font-size:13px;color:#1F7A73;margin-bottom:16px;}
            .meta{font-size:11px;color:#667;border-bottom:1px solid #e0e5e8;padding-bottom:12px;margin-bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:4px;}

            .section-label{font-size:10px;font-weight:700;color:#1F7A73;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px;}
            .pdi-row{display:flex;align-items:center;gap:16px;margin-bottom:12px;}
            .pdi-score{font-size:36px;font-weight:700;color:#1a2530;}
            .pdi-badge{padding:4px 12px;border-radius:3px;font-size:12px;font-weight:700;letter-spacing:0.5px;}
            .signal-box{border-left:3px solid ${psColor};background:#f8f9fa;padding:10px 14px;border-radius:0 4px 4px 0;margin-bottom:12px;}
            .signal-label{font-size:10px;font-weight:700;color:${psColor};letter-spacing:1px;margin-bottom:4px;}
            .signal-text{font-size:13px;color:#1a2530;line-height:1.5;}

            .evidence-list li{font-size:11px;color:#445;padding:3px 0 3px 12px;border-bottom:1px solid #f0f2f4;line-height:1.5;position:relative;}

          </style></head><body>
          <h1>Kinetra Bio</h1><div class="subtitle">Process Deviation Analysis Report</div>

            <div><strong>Organism:</strong> ${orgName}</div>
            <div><strong>Analysis hour:</strong> ${result.runHour}h</div>
            <div><strong>Reference batch:</strong> ${goldName||"(not specified)"}</div>
            <div><strong>Current run:</strong> ${currName||"(not specified)"}</div>
            <div><strong>Generated:</strong> ${ts}</div>
            <div><strong>Engine:</strong> Kinetra Bio v5.9.8</div>
          </div>
          <div class="section">
            <div class="section-label">Process Deviation Index</div>
            <div class="pdi-row">
              <div class="pdi-score">${result.pdi}</div>
              <div class="pdi-badge" style="background:${result.riskColor}22;color:${result.riskColor};border:1px solid ${result.riskColor}44">${result.riskLabel}</div>
            </div>
          </div>
          <div class="section">
            <div class="section-label">${psLabel}</div>

          </div>
          <div class="footer">
            <span>Kinetra Bio · michael@kinetrabio.com · kinetrabio.com</span>

          </div>

          printWindow.document.close();
          printWindow.focus();
          setTimeout(()=>{ printWindow.print(); }, 400);
        };
        return (

            <button onClick={exportReport} style={{
              padding:"7px 16px",background:"transparent",border:"1px solid "+C.teal,

      {/* ═══════════════════════════════════════════════════════════════════
          EVIDENCE RECORD — PROTOTYPE, NOT A VALIDATED PRODUCTION FEATURE
          First illustrative implementation of competing-hypothesis reasoning
          over the existing detection layers above. Uses a simplified,
          fully-transparent weighted-evidence scoring method -- explicitly NOT
          a rigorous Bayesian network, NOT clinically/biologically validated.
          Currently scoped to CHO's DO/pH/lactate/pCO2 ambiguity case only.
      ═══════════════════════════════════════════════════════════════════ */}
      {orgId === "cho" && (() => {
        const ec = computeEvidenceRecord(data, golden, result.runHour);
        if (!ec) return null;

          <div style={{marginTop:12,padding:"12px 14px",background:"#1a1410",border:"1px solid #7a5a2a",borderRadius:4}}>

              <div style={{fontSize:9,color:"#8a7050",fontStyle:"italic"}}>illustrative · not a verified production feature</div>
            </div>
            <div style={{fontSize:11,color:C.dim,marginBottom:10}}>{ec.trigger}</div>
            {ec.hypotheses.map((h,i)=>(
              <div key={i} style={{marginBottom:8,paddingBottom:8,borderBottom:i<ec.hypotheses.length-1?"1px solid #3a2f1f":"none"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                  <div style={{fontSize:12,color:C.text,fontWeight:i===0?600:400,maxWidth:"75%"}}>{h.hypothesis}</div>
                  <div style={{fontSize:11,fontWeight:600,color:i===0?"#d4a24a":C.dim}}>{i===0?"Leading":"Alt"}</div>
                </div>
                {h.evidence_for.map((e,j)=>(
                  <div key={j} style={{fontSize:10,color:"#7fae7f",paddingLeft:10,position:"relative",marginBottom:2}}>
                    <span style={{position:"absolute",left:0}}>+</span>{e}
                  </div>
                ))}
                {h.evidence_against.map((e,j)=>(
                  <div key={j} style={{fontSize:10,color:"#c07f7f",paddingLeft:10,position:"relative",marginBottom:2}}>

            </div>
            <div style={{fontSize:10,color:C.dim,marginTop:6,fontStyle:"italic"}}>
              Decision status: {ec.decision_status}
            </div>
          </div>
        );
      })()}

      {orgId === "bacillus" && (() => {
        const ec = computeBacillusEvidenceRecord(data, golden, result.runHour);
        if (!ec) return null;
        return (
          <div style={{marginTop:12,padding:"12px 14px",background:"#101a10",border:"1px solid #2a6a2a",borderRadius:4}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{fontSize:10,fontWeight:700,color:"#6ac46a",letterSpacing:1.5}}>EVIDENCE RECORD — PROTOTYPE</div>
              <div style={{fontSize:9,color:"#508050",fontStyle:"italic"}}>illustrative · not a verified production feature</div>

            <div style={{fontSize:11,color:C.dim,marginBottom:10}}>{ec.trigger}</div>
            {ec.hypotheses.map((h,i)=>(
              <div key={i} style={{marginBottom:8,paddingBottom:8,borderBottom:i<ec.hypotheses.length-1?"1px solid #1f3a1f":"none"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                  <div style={{fontSize:12,color:C.text,fontWeight:i===0?600:400,maxWidth:"75%"}}>{h.hypothesis}</div>
                  <div style={{fontSize:11,fontWeight:600,color:i===0?"#6ac46a":C.dim}}>{i===0?"Leading":"Alt"}</div>
                </div>
                {h.evidence_for.map((e,j)=>(
                  <div key={j} style={{fontSize:10,color:"#7fae7f",paddingLeft:10,position:"relative",marginBottom:2}}>
                    <span style={{position:"absolute",left:0}}>+</span>{e}
                  </div>
                ))}
                {h.evidence_against.map((e,j)=>(
                  <div key={j} style={{fontSize:10,color:"#c07f7f",paddingLeft:10,position:"relative",marginBottom:2}}>

      {/* ── CAR-T EVIDENCE RECORD ── */}
      {orgId === "cart" && (() => {

          <div style={{marginTop:12,padding:"12px 14px",background:"#0f1a22",border:"1px solid #2a5a7a",borderRadius:4}}>
