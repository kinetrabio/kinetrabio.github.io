const C = {
  bg:"#0D1B2A", panel:"#122035", card:"#162844", border:"#2A4060",
  text:"#F0F4F8", label:"#C8D8E8", dim:"#A0B8CC",

};

// ── FEATURE FLAGS ──
// APQ is currently a rule-based simulation, not a live reasoning agent (see APQPanel /
// runAPQ). Hidden by default for customer-facing validation engagements -- it doesn't
// help prove the core deviation-detection capability, and a customer discovering the
// "AI agent" is a scripted lookup table risks coloring perception of the whole product,
// not just this one feature. Flip to true for internal use or once v6.0's real API
// integration replaces the fallback.
const SHOW_APQ_PANEL = false;

const ORGANISMS = [
  {id:"cho",       label:"CHO Fed-Batch",          short:"CHO",    duration:240, watchFor:"DO crisis · glucose-lactate cascade"},
  {id:"ecoli",     label:"E. coli",                short:"E.COLI", duration:30,  watchFor:"Acetate accumulation · overflow metabolism"},
  {id:"bacillus",  label:"Bacillus",               short:"BAC",    duration:36,  watchFor:"Premature sporulation · nutrient depletion"},
  {id:"yeast",     label:"Yeast",                  short:"YEAST",  duration:36,  watchFor:"Ethanol accumulation · Crabtree effect"},
  {id:"anaerobic", label:"Anaerobic",              short:"ANA",    duration:48,  watchFor:"Oxygen ingress · immediately lethal"},
  {id:"pichia",    label:"Pichia pastoris",        short:"PICH",   duration:144, watchFor:"Methanol/DO feed mismatch · AOX1 induction failure", validationLabel:"Validated*", validationFootnote:"* FP clean, TP MODERATE confirmed. Real in vitro data, CORA K. phaffii (UAB Spain, 2024). ELEVATED/CRITICAL tier empirical coverage pending."},
  {id:"cart",      label:"Allogeneic CAR-T",       short:"CAR-T",  duration:336, watchFor:"Viability collapse · expansion stall · activation failure"},
];

const DIV_THRESHOLD = {cho:0.12, ecoli:0.10, bacillus:0.08, yeast:0.12, anaerobic:0.08, pichia:0.10, cart:0.10};

// ── LACTATE SHIFT DETECTION — CHO SPECIFIC ──
// The lactate production-to-consumption shift is a fundamental CHO metabolic event
// Expected: lactate rises in exponential growth phase (days 1-4), then shifts to
// consumption in late fed-batch (days 4-7+) as culture becomes more efficient.
// Reference: Khare et al. 2025 bioRxiv — KOM captures lactate shift, SOM cannot.
// Failure modes:
//   1. Lactate continues rising past expected shift point — metabolic stress
//   2. Lactate rises too fast in early phase — overflow metabolism
//   3. Lactate fails to decline after shift point — impaired consumption
//   4. Sudden lactate rise after established consumption — process disturbance

// SPECIFIC PRODUCTIVITY (Qp) CALCULATION — CHO
// Qp = rate of antibody production per viable cell
// Expressed as pg/cell/day — typical range 10-60 pg/cell/day for mAb production
// Declining Qp at stable or rising VCD = metabolic uncoupling from productivity
// Requires antibody_g_L column in CSV

// Qp = delta_titer / (avg_VCD * dt_days) -- both denominator terms can be small
// early in a run (low VCD right after inoculation, narrow window between sample
// points), which inflates the result into a statistically meaningless number even
// though the arithmetic itself is correct. Real bioprocess practice doesn't trust
// Qp estimates in early/lag-phase culture for the same reason. Gate both terms at
// the source rather than displaying an unreliable number.
const QP_MIN_VCD = 1.0;      // 10^6 cells/mL -- below this, still lag/early-exponential
const QP_MIN_DT_DAYS = 0.5;  // 12 hours -- minimum window for a stable rate estimate

function calcQp(currData) {
  if (!currData || currData.length < 2) return null;
  const pts = currData.filter(r =>
    r.antibody_g_L != null && !isNaN(r.antibody_g_L) &&
    r.viable_cell_density_E6_per_mL != null && !isNaN(r.viable_cell_density_E6_per_mL) &&
    r.time_hours != null
  );
  if (pts.length < 2) return null;

  // Calculate Qp over the last available window (last 2 points minimum)
  const recent = pts.slice(Math.max(0, pts.length - 3));
  if (recent.length < 2) return null;

  const first = recent[0];
  const last = recent[recent.length - 1];
  const dt_days = (last.time_hours - first.time_hours) / 24;
  if (dt_days < QP_MIN_DT_DAYS) return null;

  // Delta titer in g/L, VCD in 10^6 cells/mL
  // Qp = (delta_titer_g_L * 1e6 pg/g) / (avg_VCD_E6_cells_mL * 1e6 cells/mL * dt_days)
  // = delta_titer / (avg_VCD * dt_days) pg/cell/day
  const delta_titer = last.antibody_g_L - first.antibody_g_L;
  const avg_vcd = (first.viable_cell_density_E6_per_mL + last.viable_cell_density_E6_per_mL) / 2;
  if (avg_vcd < QP_MIN_VCD || delta_titer < 0) return null;

  const qp = (delta_titer / (avg_vcd * dt_days)) * 1000; // pg/cell/day
  return Math.round(qp * 10) / 10;
}

// ── SPECIFIC GROWTH RATE (mu) CALCULATION — E. COLI ──
// mu = (ln OD2 - ln OD1) / (t2 - t1) in h-1
// Target range for fed-batch soluble expression: 0.10-0.15 h-1
// Above 0.20 h-1: overflow metabolism risk — acetate accumulation imminent
// Below 0.05 h-1 post-induction: poor induction response
// v6.0 NOTE: Feed rate deviation detection — requires OPC-UA live pump data.
// When glucose feed rate deviates from target profile, mu deviation is the consequence.
// With OPC-UA, detect feed pump failure upstream before mu and acetate are affected.
// Priority for v6.0 integration: feed_rate_g_L_hr as real-time control parameter.

function calcMuEcoli(currData) {
  if (!currData || currData.length < 3) return null;
  const pts = currData
    .filter(r => r.OD600 != null && !isNaN(r.OD600) && r.OD600 > 0.5 && r.time_hours != null)
    .slice(-4); // last 4 points
  if (pts.length < 2) return null;
  const first = pts[0];
  const last = pts[pts.length-1];
  const dt = last.time_hours - first.time_hours;
  if (dt <= 0) return null;
  const mu = (Math.log(last.OD600) - Math.log(first.OD600)) / dt;
  return Math.round(mu * 1000) / 1000; // h-1 to 3 decimal places
}

// ── TEMPERATURE SHIFT DETECTION — E. COLI ──
// Induction temperature shift: 37C -> 25-30C
// Shift should occur when OD600 reaches induction target (typically 30-50)
// Temperature above 35C post-induction: inclusion body formation risk
// Temperature below 22C: growth arrest, poor expression

function detectTempShift(currData, runPct) {
  if (!currData || currData.length < 2) return null;
  const tempPresent = currData.some(r => r.temperature_C != null && !isNaN(r.temperature_C));
  if (!tempPresent) return null;

  const last = currData[currData.length-1];
  const currTemp = last.temperature_C;
  if (currTemp == null || isNaN(currTemp)) return null;

  const inducedPresent = last.induced != null && !isNaN(last.induced);
  const isInduced = inducedPresent ? last.induced >= 1 : runPct > 40;

  // Detect if a temperature shift has occurred in the run
  const temps = currData.filter(r => r.temperature_C != null && !isNaN(r.temperature_C));
  const maxTemp = Math.max(...temps.map(r => r.temperature_C));
  const shiftOccurred = maxTemp > 34 && currTemp < 33;

  if (isInduced && currTemp > 35) {
    return {
      concern: "warn",
      evidenceText: "Temperature above 35C post-induction — inclusion body formation risk. Induction temperature shift to 25-30C expected.",
      evidenceScore: 1.4,
    };
  }
  if (isInduced && !shiftOccurred && runPct > 50) {
    return {
      concern: "warn",
      evidenceText: "No induction temperature shift detected at " + runPct + "% run completion — confirm temperature control strategy.",
      evidenceScore: 0.8,
    };
  }
  return null;
}

// ── RESPIRATORY QUOTIENT (RQ) CALCULATION — E. COLI AND BACILLUS ──
// RQ = CER / OUR
// RQ 0.9-1.0: glucose oxidation — efficient aerobic metabolism
// RQ 1.0-1.2: approaching overflow — reduce feed rate
// RQ > 1.2: overflow metabolism active — acetate accumulation imminent
// RQ < 0.8: possible carbon limitation or metabolic shift

function calcRQ(currData) {
  if (!currData || currData.length < 1) return null;
  const last = currData[currData.length-1];
  if (last.CER_mmol_L_hr == null || last.OUR_mmol_L_hr == null) return null;
  if (isNaN(last.CER_mmol_L_hr) || isNaN(last.OUR_mmol_L_hr)) return null;
  if (last.OUR_mmol_L_hr <= 0) return null;
  return Math.round((last.CER_mmol_L_hr / last.OUR_mmol_L_hr) * 100) / 100;
}

const LACTATE_SHIFT_PARAMS = {
  // Shift expected between 30-50% run completion in standard CHO fed-batch
  // Based on Cell Boost 7a/7b feed regime (Cytiva) — day 3-5 of 14-day process
  shift_start_pct: 0.30,   // 30% run completion — shift may begin
  shift_expected_pct: 0.40, // 40% — shift should be underway
  shift_late_pct: 0.55,    // 55% — if still rising, metabolic stress signal
  // Production phase: lactate rising is normal but rate should not exceed this
  max_production_rate_mM_per_hr: 0.8, // mM/hr — above this is overflow metabolism
  // Consumption phase: lactate should be declining
  min_consumption_rate_mM_per_hr: -0.3, // negative = declining
  // Absolute thresholds — still apply but context-qualified
  warn_absolute: 20,
  crit_absolute: 30,
  // Peak lactate before shift — above this even in production phase needs attention
  peak_warn: 18,
};

// ALANINE SHIFT DETECTION — CHO SPECIFIC
// Alanine shows production-to-consumption dynamics coupled to lactate shift
// Reference: Khare et al. 2025 — alanine consumption after day 4 driven by
// reversibility of the alanine reaction, governed by vmax3r and Km3ala
// Alanine rising continuously without a shift is a metabolic stress signal
const ALANINE_SHIFT_PARAMS = {
  shift_expected_pct: 0.45,  // 45% run completion — shift should begin
  shift_late_pct: 0.60,      // 60% — if still accumulating, concern
  max_production_rate: 0.6,  // mM/hr — above this is abnormal accumulation
};

function detectAlanineShift(currData, goldenData, runPct, runHour) {
  if (!currData || currData.length < 4) return null;
  const alaninePresent = currData.some(r => r.alanine_mM != null && !isNaN(r.alanine_mM));
  if (!alaninePresent) return null;

  const n = currData.length;
  const window = currData.slice(Math.max(0, n-4));
  let alaSlope = null;
  const pts = window.filter(r => r.alanine_mM != null && !isNaN(r.alanine_mM) && r.time_hours != null);
  if (pts.length >= 2) {
    const dt = pts[pts.length-1].time_hours - pts[0].time_hours;
    const dala = pts[pts.length-1].alanine_mM - pts[0].alanine_mM;
    alaSlope = dt > 0 ? dala / dt : null;
  }

  const currAla = currData[n-1].alanine_mM;
  if (currAla == null || isNaN(currAla)) return null;

  const inShiftZone = runPct >= ALANINE_SHIFT_PARAMS.shift_expected_pct * 100;

  // Golden batch alanine shift detection
  let goldenShifted = false;
  if (goldenData) {
    for (let i = 3; i < goldenData.length; i++) {
      if (goldenData[i].alanine_mM != null && goldenData[i-1].alanine_mM != null) {
        if (goldenData[i].alanine_mM < goldenData[i-1].alanine_mM - 0.5) {
          goldenShifted = true; break;
        }
      }
    }
  }

  if (inShiftZone && alaSlope !== null && alaSlope > 0.3 && goldenShifted) {
    return {
      concern: "warn",
      evidenceText: "Alanine still accumulating at run stage where reference batch shows consumption — coupled metabolic stress signal with lactate trajectory",
      evidenceScore: 0.8,
    };
  }
  if (runPct >= ALANINE_SHIFT_PARAMS.shift_late_pct * 100 && alaSlope !== null && alaSlope > 0.2) {
    return {
      concern: "warn",
      evidenceText: "Alanine not shifting to consumption in late run — metabolic stress pattern confirmed by both lactate and alanine trajectories",
      evidenceScore: 1.0,
    };
  }
  return null;
}

function detectLactateShift(currData, goldenData, runPct, runHour) {
  if (!currData || currData.length < 4) return null;

  const result = {
    phase: null,       // "production" | "shift" | "consumption" | "unknown"
    shiftDetected: false,
    shiftHour: null,
    concern: null,     // null | "warn" | "critical"
    message: null,
    evidenceText: null,
    evidenceScore: 0,
  };

  // Step 1 — Determine expected phase from run progress
  const inProductionPhase = runPct < LACTATE_SHIFT_PARAMS.shift_start_pct * 100;
  const inShiftZone = runPct >= LACTATE_SHIFT_PARAMS.shift_start_pct * 100 &&
                      runPct < LACTATE_SHIFT_PARAMS.shift_late_pct * 100;
  const inConsumptionPhase = runPct >= LACTATE_SHIFT_PARAMS.shift_late_pct * 100;

  // Step 2 — Calculate current lactate rate of change (last 4 points)
  const n = currData.length;
  const window = currData.slice(Math.max(0, n-4));
  let lacSlope = null;
  if (window.length >= 2) {
    const pts = window.filter(r => r.lactate_mM != null && !isNaN(r.lactate_mM) && r.time_hours != null);
    if (pts.length >= 2) {
      const dt = pts[pts.length-1].time_hours - pts[0].time_hours;
      const dlac = pts[pts.length-1].lactate_mM - pts[0].lactate_mM;
      lacSlope = dt > 0 ? dlac / dt : null;
    }
  }

  const currLac = currData[n-1].lactate_mM;
  if (currLac == null || isNaN(currLac)) return null;

  // Step 3 — Get golden batch lactate slope at same run position for comparison
  let goldenSlope = null;
  let goldenShiftDetected = false;
  if (goldenData && goldenData.length >= 4) {
    const goldenAtStage = goldenData.filter(r => {
      const gRunPct = r.time_hours / (goldenData[goldenData.length-1].time_hours || 240) * 100;
      return gRunPct >= runPct - 15 && gRunPct <= runPct + 5;
    });
    if (goldenAtStage.length >= 2) {
      const gPts = goldenAtStage.filter(r => r.lactate_mM != null && !isNaN(r.lactate_mM));
      if (gPts.length >= 2) {
        const gDt = gPts[gPts.length-1].time_hours - gPts[0].time_hours;
        const gDlac = gPts[gPts.length-1].lactate_mM - gPts[0].lactate_mM;
        goldenSlope = gDt > 0 ? gDlac / gDt : null;
        goldenShiftDetected = goldenSlope !== null && goldenSlope < 0;
      }
    }
    // Detect if golden batch ever shifted to consumption
    for (let i = 1; i < goldenData.length; i++) {
      if (goldenData[i].lactate_mM != null && goldenData[i-1].lactate_mM != null) {
        if (goldenData[i].lactate_mM < goldenData[i-1].lactate_mM - 1.0) {
          goldenShiftDetected = true;
          break;
        }
      }
    }
  }

  // Step 4 — Phase classification and concern detection
  if (inProductionPhase) {
    result.phase = "production";
    // Normal: lactate rising. Concern: rising too fast (overflow metabolism)
    if (lacSlope !== null && lacSlope > LACTATE_SHIFT_PARAMS.max_production_rate_mM_per_hr) {
      result.concern = "warn";
      result.message = "Lactate accumulating faster than expected in production phase (" +
        lacSlope.toFixed(1) + " mM/hr). Monitor glucose feed rate — overflow metabolism risk.";
      result.evidenceText = "Lactate accumulation rate (" + lacSlope.toFixed(1) +
        " mM/hr) exceeds expected production phase rate — overflow metabolism risk";
      result.evidenceScore = 0.8;
    }
    if (currLac > LACTATE_SHIFT_PARAMS.peak_warn) {
      result.concern = result.concern === "warn" ? "warn" : "warn";
      result.message = "Lactate approaching critical range in production phase (" +
        currLac.toFixed(1) + "mM). Begin reducing glucose feed rate.";
      result.evidenceText = "Lactate at " + currLac.toFixed(1) +
        "mM in production phase — approaching shift zone with high baseline";
      result.evidenceScore = Math.max(result.evidenceScore, 0.6);
    }
  } else if (inShiftZone) {
    result.phase = "shift";
    // Critical check: is the shift happening?
    if (lacSlope !== null && lacSlope > 0.3) {
      // Lactate still rising in shift zone — this is the key concern
      if (goldenShiftDetected) {
        // Golden batch has shifted but current run has not
        result.concern = "warn";
        result.message = "Lactate-to-consumption shift expected but lactate still rising at Hour " +
          runHour + " (+" + lacSlope.toFixed(1) +
          " mM/hr). Reference batch shifted at this stage. Review glucose feed strategy.";
        result.evidenceText = "Lactate shift expected at Hour " + runHour +
          " — reference batch shows consumption, current run still accumulating";
        result.evidenceScore = 1.4;
      } else if (currLac > LACTATE_SHIFT_PARAMS.warn_absolute) {
        result.concern = "warn";
        result.message = "Lactate above " + LACTATE_SHIFT_PARAMS.warn_absolute +
          "mM with no shift detected. Reduce glucose feed 30-40%.";
        result.evidenceText = "Lactate above " + LACTATE_SHIFT_PARAMS.warn_absolute +
          "mM in shift zone with no consumption trend";
        result.evidenceScore = 1.2;
      }
    } else if (lacSlope !== null && lacSlope < 0) {
      // Shift is happening — healthy sign
      result.phase = "shift";
      result.shiftDetected = true;
      result.shiftHour = runHour;
      // No concern — this is correct behavior. Suppress absolute threshold alarms.
      result.concern = null;
      result.message = null;
    }
  } else if (inConsumptionPhase) {
    result.phase = "consumption";
    if (lacSlope !== null && lacSlope > 0.5) {
      // Lactate rising again in consumption phase — process disturbance
      result.concern = currLac > LACTATE_SHIFT_PARAMS.crit_absolute ? "critical" : "warn";
      result.message = "Lactate rising in established consumption phase — unexpected metabolic reversal at Hour " +
        runHour + ". Review dissolved oxygen, pH, and glucose feed. Possible culture stress event.";
      result.evidenceText = "Lactate reversal in consumption phase at Hour " + runHour +
        " — rising at +" + lacSlope.toFixed(1) + " mM/hr after established decline";
      result.evidenceScore = result.concern === "critical" ? 2.4 : 1.6;
    } else if (lacSlope !== null && lacSlope > -0.1 && currLac > 15) {
      // Lactate plateaued high — impaired consumption
      result.concern = "warn";
      result.message = "Lactate consumption stalled at " + currLac.toFixed(1) +
        "mM — expected continued decline at this stage. Monitor feed strategy.";
      result.evidenceText = "Lactate consumption stalled at " + currLac.toFixed(1) +
        "mM in late run — expected continued decline";
      result.evidenceScore = 0.8;
    } else {
      // Healthy consumption phase — confirm this is normal
      result.concern = null;
    }
  }

  return result;
}

// ── CONVOLUTIONAL TRAJECTORY ANALYSIS ──
// Window sizes calibrated per organism based on process dynamics
// Anaerobic: 3 points — oxygen ingress is immediate, cannot afford lag
// All others: 4 points — sufficient for reliable slope estimation without over-smoothing
const CONV_WINDOW = {cho:4, ecoli:4, bacillus:4, yeast:4, anaerobic:3, pichia:4};

// Evidence score weights for PDI — trajectory signals weighted differently from point signals
const CONV_WEIGHTS = {
  trajectory_diverge:  1.8,  // Layer 2 — rate of change diverging from golden batch
  acceleration_signal: 2.4,  // Layer 3 — divergence accelerating (second derivative)
};

// ── GAUSSIAN PROCESS — FULL IMPLEMENTATION ──
// Squared exponential (RBF) kernel — standard for smooth bioprocess trajectories
// Hyperparameters estimated from golden batch via maximum likelihood estimation
// Independent GP per parameter — transparent, auditable, validatable step by step

function seKernel(t1, t2, lengthScale, signalVar) {
  // Squared exponential kernel: k(t1,t2) = signalVar * exp(-0.5 * ((t1-t2)/lengthScale)^2)
  const diff = (t1 - t2) / lengthScale;
  return signalVar * Math.exp(-0.5 * diff * diff);
}

function buildKernelMatrix(times, lengthScale, signalVar, noiseVar) {
  // Build the full covariance matrix K(X,X) + noise*I
  const n = times.length;
  const K = [];
  for (let i = 0; i < n; i++) {
    K[i] = [];
    for (let j = 0; j < n; j++) {
      K[i][j] = seKernel(times[i], times[j], lengthScale, signalVar);
      if (i === j) K[i][j] += noiseVar;
    }
  }
  return K;
}

function choleskyDecomp(A) {
  // Cholesky decomposition — L such that A = L * L^T
  // Required for numerically stable GP inference
  const n = A.length;
  const L = Array.from({length:n}, () => new Array(n).fill(0));
  for (let i = 0; i < n; i++) {
    for (let j = 0; j <= i; j++) {
      let sum = 0;
      for (let k = 0; k < j; k++) sum += L[i][k] * L[j][k];
      if (i === j) {
        const val = A[i][i] - sum;
        L[i][j] = val > 0 ? Math.sqrt(val) : 1e-6;
      } else {
        L[i][j] = L[j][j] > 1e-10 ? (A[i][j] - sum) / L[j][j] : 0;
      }
    }
  }
  return L;
}

function solveTriangular(L, b) {
  // Forward substitution: solve L*x = b
  const n = L.length;
  const x = new Array(n).fill(0);
  for (let i = 0; i < n; i++) {
    let sum = 0;
    for (let j = 0; j < i; j++) sum += L[i][j] * x[j];
    x[i] = L[i][i] > 1e-10 ? (b[i] - sum) / L[i][i] : 0;
  }
  return x;
}

function solveTriangularT(L, b) {
  // Back substitution: solve L^T * x = b
  const n = L.length;
  const x = new Array(n).fill(0);
  for (let i = n-1; i >= 0; i--) {
    let sum = 0;
    for (let j = i+1; j < n; j++) sum += L[j][i] * x[j];
    x[i] = L[i][i] > 1e-10 ? (b[i] - sum) / L[i][i] : 0;
  }
  return x;
}

function estimateHyperparams(times, values) {
  // Maximum likelihood estimation of GP hyperparameters from golden batch data
  // lengthScale: controls smoothness — estimated as fraction of total time span
  // signalVar: estimated from data variance
  // noiseVar: small fraction of signal variance — measurement noise
  const n = times.length;
  if (n < 3) return { lengthScale: 24, signalVar: 1, noiseVar: 0.01 };

  const timeSpan = times[times.length-1] - times[0];
  const mean = values.reduce((s,v)=>s+v,0) / n;
  const variance = values.reduce((s,v)=>s+(v-mean)*(v-mean),0) / n;

  // Length scale: typical smooth bioprocess trajectory changes over ~25% of run duration
  const lengthScale = Math.max(timeSpan * 0.25, 1);
  const signalVar   = Math.max(variance * 0.9, 0.001);
  const noiseVar    = Math.max(variance * 0.05, 0.0001);

  return { lengthScale, signalVar, noiseVar };
}

function gpPredict(trainTimes, trainValues, testTimes, hyperparams) {
  // Full GP posterior prediction
  // Returns mean and variance at each test point
  const { lengthScale, signalVar, noiseVar } = hyperparams;
  const n = trainTimes.length;
  const m = testTimes.length;

  // Build training covariance matrix K(X,X) + noiseI
  const K = buildKernelMatrix(trainTimes, lengthScale, signalVar, noiseVar);
  const L = choleskyDecomp(K);

  // Compute alpha = K^{-1} * y via Cholesky solve
  const alpha_tmp = solveTriangular(L, trainValues);
  const alpha = solveTriangularT(L, alpha_tmp);

  const means = [];
  const vars  = [];

  for (let i = 0; i < m; i++) {
    // k_star: covariance between test point and training points
    const kStar = trainTimes.map(t => seKernel(testTimes[i], t, lengthScale, signalVar));

    // Posterior mean: k_star^T * alpha
    let mean = 0;
    for (let j = 0; j < n; j++) mean += kStar[j] * alpha[j];
    means.push(mean);

    // Posterior variance: k(x*,x*) - k_star^T * K^{-1} * k_star
    const v = solveTriangular(L, kStar);
    const kStarStar = seKernel(testTimes[i], testTimes[i], lengthScale, signalVar);
    const postVar = Math.max(0, kStarStar - v.reduce((s,vi)=>s+vi*vi,0));
    vars.push(postVar);
  }

  return { means, vars };
}

function buildGPBands(goldenData, testTimes, paramKey) {
  // Build GP confidence bands from golden batch data
  // Returns upper and lower bounds at 2 standard deviations (95% posterior predictive interval)
  const trainPts = goldenData
    .filter(r => r[paramKey] != null && !isNaN(r[paramKey]) && r.time_hours != null)
    .map(r => ({ t: r.time_hours, v: r[paramKey] }));

  if (trainPts.length < 3) return null;

  const trainTimes  = trainPts.map(p => p.t);
  const trainValues = trainPts.map(p => p.v);

  const hyperparams = estimateHyperparams(trainTimes, trainValues);
  const { means, vars } = gpPredict(trainTimes, trainValues, testTimes, hyperparams);

  // 2 SD posterior predictive interval (95% coverage)
  // Predictive variance = posterior variance + noise variance
  return testTimes.map((t, i) => ({
    t,
    mean:  means[i],
    upper: means[i] + 2 * Math.sqrt(vars[i] + hyperparams.noiseVar),
    lower: means[i] - 2 * Math.sqrt(vars[i] + hyperparams.noiseVar),
  }));
}

function checkGPViolation(currData, gpBands, paramKey, goldenData) {
  // Check whether current run exits the GP confidence band
  // Returns the first violation point if any
  // Requires meaningful deviation from golden batch — not just floating point noise
  if (!gpBands || !currData) return null;
  const bandMap = {};
  gpBands.forEach(b => { bandMap[b.t] = b; });
  
  // Build golden batch map for comparison
  const goldenMap = {};
  if (goldenData) goldenData.forEach(r => {
    if (r[paramKey] != null && !isNaN(r[paramKey])) goldenMap[r.time_hours] = r[paramKey];
  });

  for (const row of currData) {
    const val = row[paramKey];
    const band = bandMap[row.time_hours];
    if (val == null || isNaN(val) || !band) continue;
    
    // Check for identity — if current value is identical to golden at this time point,
    // it cannot be a genuine violation regardless of band width
    const goldenVal = goldenMap[row.time_hours];
    if (goldenVal != null && Math.abs(val - goldenVal) < 0.001) continue;
    
    // Require the violation to be meaningful — at least 5% outside the band
    const bandWidth = Math.abs(band.upper - band.lower);
    const minViolation = bandWidth * 0.05;
    
    if (val < band.lower - minViolation || val > band.upper + minViolation) {
      return {
        hour:  row.time_hours,
        value: val,
        upper: band.upper,
        lower: band.lower,
        mean:  band.mean,
        direction: val < band.lower ? "below" : "above",
      };
    }
  }
  return null;
}

// STAGED CALIBRATION FRAMEWORK (v5.9.8 → validation-track)
//
// Everything below is ADDITIVE and DORMANT until real batch archive data
// exists. With an empty/absent archive (archive.length === 0), buildGPBandsStaged
// falls back to the exact same calculation as buildGPBands/checkGPViolation above
// — verified byte-for-byte identical via regression testing (see project notes).
//
// PROBLEM THIS ADDRESSES: buildGPBands above estimates noiseVar/signalVar from
// the internal variance of a SINGLE golden batch. That's a proxy for real
// batch-to-batch variability, not a measurement of it — testing across all six
// organism modules confirmed this produces false-flag rates of 40-95% on
// genuinely healthy batches for low-variance parameters (pH in every module;
// viability_percent in 5/6; temperature_C in Pichia; DO/glucose/osmolality in CHO).
//
// FIX: once real historical batches accumulate in an archive, noiseVar and
// signalVar are computed from ACTUAL observed inter-batch variance instead of
// single-batch internal wobble, and the fixed ±2SD band multiplier is replaced
// with a Student's t-distribution critical value scaled to how many real batches
// back the estimate (very wide at 2 batches, converging to ~2SD by ~15-20+).
// This is standard small-sample statistics, not an invented calibration number.
//
// IMPORTANT — caught and fixed during testing: an earlier version of this code
// replaced only noiseVar with real pooled variance while leaving signalVar at
// its old single-batch value. When noiseVar became large relative to signalVar,
// the GP's zero-mean prior dominated and predicted means collapsed toward zero
// instead of tracking the golden trajectory. Fix: both signalVar and noiseVar
// now scale together from the same pooled variance, using the same 90%/5% split
// the original single-batch estimator already uses.

// Inverse Student's t CDF via the regularized incomplete beta function
// (Numerical Recipes method). Verified against scipy.stats.t.ppf to <0.01
// absolute error across df = 1 through 99 before this was integrated.
function logGamma(x) {
  const cof = [76.18009172947146, -86.50532032941677, 24.01409824083091,
               -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let y = x, tmp = x + 5.5;
  tmp -= (x + 0.5) * Math.log(tmp);
  let ser = 1.000000000190015;
  for (let j = 0; j < 6; j++) { y += 1; ser += cof[j] / y; }
  return -tmp + Math.log(2.5066282746310005 * ser / x);
}

function betacf(x, a, b) {
  const MAXIT = 200, EPS = 3e-9, FPMIN = 1e-300;
  const qab = a + b, qap = a + 1, qam = a - 1;
  let c = 1, d = 1 - qab * x / qap;
  if (Math.abs(d) < FPMIN) d = FPMIN;
  d = 1 / d;
  let h = d;
  for (let m = 1; m <= MAXIT; m++) {
    const m2 = 2 * m;
    let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1 / d;
    const del = d * c; h *= del;
    if (Math.abs(del - 1) < EPS) break;
  }
  return h;
}

function incompleteBeta(x, a, b) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  const bt = Math.exp(logGamma(a + b) - logGamma(a) - logGamma(b) +
                       a * Math.log(x) + b * Math.log(1 - x));
  if (x < (a + 1) / (a + b + 2)) return bt * betacf(x, a, b) / a;
  return 1 - bt * betacf(1 - x, b, a) / b;
}

function tCDF(t, df) {
  const x = df / (df + t * t);
  const ib = incompleteBeta(x, df / 2, 0.5);
  return t > 0 ? 1 - 0.5 * ib : 0.5 * ib;
}

function tInverseCDF(p, df) {
  if (df <= 0) return NaN;
  let lo = 0, hi = 1000;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    if (tCDF(mid, df) < p) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

const GP_BAND_TARGET_PROB = 0.9545; // matches P(-2 < Z < 2), i.e. today's fixed ±2SD
function tCriticalMatchingZ2(df) {
  if (df < 1) return 2; // fewer than 2 batches — no valid t-distribution, use today's default
  return tInverseCDF((1 + GP_BAND_TARGET_PROB) / 2, df);
}

// Real inter-batch variance: sample variance (Bessel-corrected) of a parameter's
// value across multiple real batches, at each shared timepoint, averaged across time.
// batches: array of {time_hours: value} maps, one per real batch (golden + archive).
function pooledInterBatchVariance(batches, paramKey) {
  if (batches.length < 2) return null;
  const timeSets = batches.map(b => new Set(Object.keys(b).map(Number)));
  let sharedTimes = [...timeSets[0]];
  for (let i = 1; i < timeSets.length; i++) sharedTimes = sharedTimes.filter(t => timeSets[i].has(t));
  if (sharedTimes.length === 0) return null;

  const perTimeVariances = sharedTimes.map(t => {
    const vals = batches.map(b => b[t]);
    const n = vals.length;
    const mean = vals.reduce((a, b) => a + b, 0) / n;
    return vals.reduce((a, v) => a + (v - mean) * (v - mean), 0) / (n - 1);
  });
  return perTimeVariances.reduce((a, b) => a + b, 0) / perTimeVariances.length;
}

// archiveBatches: array of {time_hours: value} maps for this specific paramKey,
// one entry per REAL historical batch beyond the golden batch. Pass [] or omit
// entirely for today's exact single-batch behavior (fully backward compatible).
function buildGPBandsStaged(goldenData, archiveBatches, testTimes, paramKey) {
  const trainPts = goldenData
    .filter(r => r[paramKey] != null && !isNaN(r[paramKey]) && r.time_hours != null)
    .map(r => ({ t: r.time_hours, v: r[paramKey] }));
  if (trainPts.length < 3) return null;

  const trainTimes = trainPts.map(p => p.t);
  const trainValues = trainPts.map(p => p.v);
  const archive = archiveBatches || [];
  const nBatches = 1 + archive.length;

  let hyperparams, multiplier;
  if (archive.length === 0) {
    // IDENTICAL to buildGPBands above — the guaranteed fallback path.
    hyperparams = estimateHyperparams(trainTimes, trainValues);
    multiplier = 2;
  } else {
    const goldenMap = {}; trainTimes.forEach((t, i) => { goldenMap[t] = trainValues[i]; });
    const allBatchMaps = [goldenMap, ...archive];
    const pooledVar = pooledInterBatchVariance(allBatchMaps, paramKey);
    const baseHp = estimateHyperparams(trainTimes, trainValues); // lengthScale (curve shape) still from golden
    hyperparams = {
      lengthScale: baseHp.lengthScale,
      signalVar: Math.max((pooledVar || 0) * 0.9, 0.001),
      noiseVar: Math.max((pooledVar || 0) * 0.05, 0.0001),
    };
    multiplier = tCriticalMatchingZ2(nBatches - 1);
  }

  const { means, vars } = gpPredict(trainTimes, trainValues, testTimes, hyperparams);
  return {
    bands: testTimes.map((t, i) => ({
      t,
      mean: means[i],
      upper: means[i] + multiplier * Math.sqrt(vars[i] + hyperparams.noiseVar),
      lower: means[i] - multiplier * Math.sqrt(vars[i] + hyperparams.noiseVar),
    })),
    nBatches,
    multiplier,
  };
}

// Maturity stage label for UI display — purely descriptive, doesn't affect any calculation.
function calibrationStage(nBatches) {
  if (nBatches <= 1) return { label: "PRE-VALIDATION", detail: "single reference batch — provisional bands" };
  if (nBatches <= 6) return { label: "T" + (nBatches - 1), detail: nBatches + " batches — bands widened for small-sample uncertainty" };
  return { label: "CALIBRATED", detail: nBatches + " batches — calibration stable" };
}

// Calculate first derivative (rate of change) over a window of data points
function calcSlope(data, key, endIdx, windowSize) {
  const start = Math.max(0, endIdx - windowSize + 1);
  const pts = [];
  for (let i = start; i <= endIdx; i++) {
    const val = data[i][key];
    if (val != null && !isNaN(val)) pts.push({ t: data[i].time_hours, v: val });
  }
  if (pts.length < 2) return null;
  // Least squares linear regression slope
  const n = pts.length;
  const sumT = pts.reduce((s,p)=>s+p.t, 0);
  const sumV = pts.reduce((s,p)=>s+p.v, 0);
  const sumTT = pts.reduce((s,p)=>s+p.t*p.t, 0);
  const sumTV = pts.reduce((s,p)=>s+p.t*p.v, 0);
  const denom = n*sumTT - sumT*sumT;
  if (Math.abs(denom) < 0.001) return 0;
  return (n*sumTV - sumT*sumV) / denom;
}

// Calculate second derivative (acceleration) — slope of slopes over two consecutive windows
function calcAcceleration(data, key, endIdx, windowSize) {
  const slope2 = calcSlope(data, key, endIdx, windowSize);
  const slope1 = calcSlope(data, key, Math.max(0, endIdx - Math.floor(windowSize/2)), windowSize);
  if (slope2 === null || slope1 === null) return null;
  return slope2 - slope1;
}

// Main convolutional analysis function
// Returns Layer 2 (trajectory) and Layer 3 (acceleration) signals
function convolutionalAnalysis(current, golden, params, orgId) {
  if (!current || current.length < 3) return { signals: [], evidenceScore: 0 };
  if (!golden || golden.length < 3) return { signals: [], evidenceScore: 0 };

  const window = CONV_WINDOW[orgId] || 4;
  const gMap = {};
  golden.forEach(r => { gMap[r.time_hours] = r; });

  const signals = [];
  let evidenceScore = 0;
  const endIdx = current.length - 1;

  params.forEach(p => {
    const currentSlope = calcSlope(current, p.key, endIdx, window);
    if (currentSlope === null) return;

    // Find matching golden batch window at same run position
    const goldenRows = golden.filter(r => r.time_hours <= current[endIdx].time_hours);
    if (goldenRows.length < 3) return;
    const goldenEndIdx = goldenRows.length - 1;
    const goldenSlope = calcSlope(golden, p.key, goldenEndIdx, Math.min(window, goldenRows.length));
    if (goldenSlope === null) return;

    // Avoid division by near-zero
    const slopeDenominator = Math.abs(goldenSlope) + 0.001;
    const slopeDeviation = Math.abs((currentSlope - goldenSlope) / slopeDenominator);
    
    // Minimum absolute slope difference to prevent floating point noise from firing
    const abslopeDiff = Math.abs(currentSlope - goldenSlope);
    const minAbsDiff = Math.abs(goldenSlope) * 0.1 + 0.01;

    // Layer 2 — trajectory divergence
    // Fire when rate of change deviates more than 50% from golden batch rate
    // AND the absolute difference is meaningful (not floating point noise)
    if (slopeDeviation > 0.5 && abslopeDiff > minAbsDiff) {
      const direction = currentSlope < goldenSlope ? "declining faster" : "rising faster";
      const magnitude = slopeDeviation > 2.0 ? "extreme" : slopeDeviation > 1.0 ? "significant" : "moderate";
      signals.push({
        layer: 2,
        param: p.label,
        text: p.label + " trajectory " + direction + " than reference batch — " + magnitude + " trajectory divergence",
        slopeDeviation: Math.round(slopeDeviation * 100),
        magnitude
      });
      evidenceScore += CONV_WEIGHTS.trajectory_diverge * Math.min(slopeDeviation, 3.0) / 3.0;
    }

    // Layer 3 — acceleration signal
    // Fire when the divergence is getting worse — second derivative check
    const currentAccel = calcAcceleration(current, p.key, endIdx, window);
    const goldenAccel  = calcAcceleration(golden,  p.key, goldenEndIdx, Math.min(window, goldenRows.length));
    if (currentAccel !== null && goldenAccel !== null) {
      const accelDiff = Math.abs(currentAccel - goldenAccel);
      const accelThreshold = Math.abs(goldenSlope) * 0.3 + 0.001;
      if (accelDiff > accelThreshold && slopeDeviation > 0.3) {
        const worsening = (p.warnLow != null && currentSlope < 0) || (p.warnHigh != null && currentSlope > 0);
        if (worsening) {
          signals.push({
            layer: 3,
            param: p.label,
            text: p.label + " deviation accelerating — trajectory worsening at increasing rate",
            accelDiff: Math.round(accelDiff * 100) / 100
          });
          evidenceScore += CONV_WEIGHTS.acceleration_signal;
        }
      }
    }
  });

  // Cap convolutional contribution to PDI evidence score
  return { signals, evidenceScore: Math.min(evidenceScore, 4.0) };
}

// ── PROCESS DEVIATION INDEX ENGINE ──
// Evidence-weighted risk scoring by organism and run stage
// Literature-grounded priors — calibrated to facility data during validation engagement
const PDI_BASELINE = {
  cho:       {early:0.02, mid:0.04, late:0.06, terminal:0.10},
  ecoli:     {early:0.02, mid:0.06, late:0.10, terminal:0.17},
  bacillus:  {early:0.04, mid:0.09, late:0.12, terminal:0.18},
  yeast:     {early:0.03, mid:0.14, late:0.18, terminal:0.22},
  anaerobic: {early:0.05, mid:0.06, late:0.08, terminal:0.12},
  pichia:    {early:0.03, mid:0.08, late:0.14, terminal:0.20},
  // CAR-T baseline: allogeneic expansion. Risk front-loaded in early activation window (day 1-3).
  // If expansion is progressing by day 5, mid-run risk is relatively stable. Terminal risk reflects
  // harvest-timing sensitivity and cumulative exhaustion risk in long expansions.
  cart:      {early:0.06, mid:0.05, late:0.08, terminal:0.12},
};

// Deliberately generic, conservative fallback for any organism ID not yet present above --
// e.g. a 7th module added without updating this map. NOT modeled on any specific organism's
// real calibration (previously this silently fell back to PDI_BASELINE.cho, which would have
// scored an uncalibrated organism using CHO's specific risk curve -- plausible-looking but
// wrong). This fallback is intentionally mid-range across all stages and flagged as
// uncalibrated wherever it's used, rather than presented as real organism-specific tuning.
const UNCALIBRATED_BASELINE = {early:0.05, mid:0.10, late:0.15, terminal:0.20};

// Likelihood multipliers — how much each type of evidence updates the probability
// P(failure|evidence) proportional to P(evidence|failure) x P(failure)
const LIKELIHOOD = {
  // Critical alert active — strong evidence of impending failure
  critical_alert:      4.8,
  // Warn alert active — moderate evidence
  warn_alert:          2.4,
  // Divergence from golden batch — scaled by percentage
  divergence_5pct:     1.4,
  divergence_10pct:    1.9,
  divergence_20pct:    2.8,
  divergence_35pct:    4.2,
  // Multiple parameters diverging simultaneously
  multi_param_div:     1.6,
  // Late run stage amplifier
  terminal_stage:      1.5,
  // Organism-specific likelihood amplifiers for key failure indicators
  bacillus_spor_warn:  3.2,
  bacillus_gluc_low:   2.8,
  ecoli_acetate_warn:  3.2,
  yeast_ethanol_warn:  2.4,
  anaerobic_do_any:    5.0,
  cho_do_warn:         2.2,
  cho_glucose_warn:    2.4,
  // Pichia: DO-tracking mismatch during methanol ramp is the module's dominant, most tractable
  // failure mode — feed rate outpacing utilization capacity, per Kinetra_Pichia_Module_Spec.docx
  pichia_do_mismatch:  3.4,
  pichia_methanol_high: 2.8,
  // CAR-T: viability collapse is the dominant signal — any viability drop is serious
  cart_viability_warn:  3.2,
  cart_viability_crit:  5.0,
  // Expansion stall by day 5 is a strong activation failure signal
  cart_expansion_stall: 3.8,
  // Contamination pattern: lactate spike + viability drop simultaneously
  cart_contamination:   4.5,
};

function calcBayesian(orgId, data, golden, params, alerts, divHour, archive) {
  // Run convolutional analysis — Layers 2 and 3
  const convResult = convolutionalAnalysis(data, golden, params, orgId);
  if (!data || !data.length) return null;
  const last = data[data.length-1];
  const runHour = last.time_hours;
  const org = ORGANISMS.find(o=>o.id===orgId);
  const runPct = org ? Math.min(100, Math.round((runHour/org.duration)*100)) : 50;
  const stage = runPct < 25 ? "early" : runPct < 60 ? "mid" : runPct < 85 ? "late" : "terminal";

  // Step 1 — Prior probability for this organism and stage
  const usingUncalibratedBaseline = !PDI_BASELINE[orgId];
  const priors = PDI_BASELINE[orgId] || UNCALIBRATED_BASELINE;
  let baseline = priors[stage];

  // Step 2 — Accumulate likelihood score using additive evidence model
  // Additive approach prevents exponential overflow while preserving sensitivity
  // Each evidence item contributes a weighted score; total is normalized to a likelihood ratio
  let evidenceScore = 0;
  const evidence = [];
  const MAX_LIKELIHOOD = 12.0; // Ceiling — prevents implausible ratios

  // Active alerts — strongest evidence
  // Only count alerts that are NOT expected from the golden batch at this run stage
  // This prevents false positives when golden batch itself ends near threshold values
  const gMapAlert = {};
  if (golden) golden.forEach(r => { gMapAlert[r.time_hours] = r; });
  const gLastAlert = gMapAlert[last.time_hours];

  // An alert is genuine if the current run is meaningfully worse than the golden batch
  const genuineAlerts = alerts.filter(a => {
    // If no golden batch reference, trust all alerts
    if (!gLastAlert) return true;
    // Check if golden batch also triggered this alert at this time point
    // by evaluating the same check against the golden batch last point
    try {
      const INTERVENTIONS_REF = INTERVENTIONS[orgId] || [];
      const matchingIntervention = INTERVENTIONS_REF.find(i => i.text === a.text);
      if (!matchingIntervention) return true;
      // If golden batch also fires this alert — it is expected, not a deviation
      const goldenAlsoFires = matchingIntervention.check(gLastAlert);
      return !goldenAlsoFires;
    } catch(e) { return true; }
  });

  const critCount = genuineAlerts.filter(a=>a.level==="CRITICAL").length;
  const warnCount = genuineAlerts.filter(a=>a.level==="WARN").length;
  if (critCount > 0) {
    evidenceScore += Math.min(critCount, 2) * 2.8;
    evidence.push("Critical alert active — not present in reference batch ("+critCount+")");
  }
  if (warnCount > 0) {
    evidenceScore += Math.min(warnCount, 2) * 1.2;
    evidence.push("Warning alert active — not present in reference batch ("+warnCount+")");
  }

  // Divergence from golden batch — capped display at 100%
  if (divHour && divHour.details && divHour.details.length > 0) {
    const maxPct = Math.max(...divHour.details.map(d=>d.pct));
    const displayPct = maxPct > 100 ? ">100" : maxPct;
    if (maxPct >= 35)      { evidenceScore += 2.2; evidence.push("Divergence "+displayPct+"% from reference batch — extreme"); }
    else if (maxPct >= 20) { evidenceScore += 1.6; evidence.push("Divergence "+displayPct+"% from reference batch — significant"); }
    else if (maxPct >= 10) { evidenceScore += 1.0; evidence.push("Divergence "+displayPct+"% from reference batch — moderate"); }
    else if (maxPct >= 5)  { evidenceScore += 0.5; evidence.push("Divergence "+displayPct+"% from reference batch — early"); }
    if (divHour.details.length >= 3) { evidenceScore += 0.8; evidence.push("Multiple parameters diverging ("+divHour.details.length+")"); }
  }

  // Organism-specific key indicators
  // CRITICAL: These only fire when the current run deviates from the golden batch
  // at the same time point. Absolute value checks alone cause false positives
  // on golden batch runs where late-stage values are naturally low.
  const gMap_org = {};
  if (golden) golden.forEach(r => { gMap_org[r.time_hours] = r; });
  const gLast_org = gMap_org[last.time_hours];

  function deviatesFromGolden(key, currentVal, goldenVal, direction, threshold) {
    // Only fire if current value deviates meaningfully from golden batch at same time point
    if (goldenVal == null || isNaN(goldenVal)) {
      // No golden batch reference — use absolute threshold cautiously
      return direction === "low" ? currentVal < threshold * 0.5 : currentVal > threshold * 1.5;
    }
    const pctDev = Math.abs((currentVal - goldenVal) / (Math.abs(goldenVal) + 0.001));
    // Must deviate more than 15% from golden AND cross the absolute threshold
    return pctDev > 0.15 && (direction === "low" ? currentVal < threshold : currentVal > threshold);
  }

  if (orgId==="bacillus") {
    const gSpor = gLast_org ? gLast_org.sporulation_index : null;
    const gGluc = gLast_org ? gLast_org.glucose_mM : null;
    const gPH   = gLast_org ? gLast_org.pH : null;
    if (deviatesFromGolden("sporulation_index", last.sporulation_index, gSpor, "high", 5))
      { evidenceScore += 1.8; evidence.push("Sporulation index elevated above reference batch baseline"); }
    if (deviatesFromGolden("glucose_mM", last.glucose_mM, gGluc, "low", 5))
      { evidenceScore += 1.4; evidence.push("Glucose approaching sporulation trigger — below reference batch trajectory"); }

    // pH — Bacillus highly pH-sensitive
    if (last.pH != null && !isNaN(last.pH)) {
      if (last.pH < 6.5 && deviatesFromGolden("pH", last.pH, gPH, "low", 6.5)) {
        evidenceScore += 1.8;
        evidence.push("pH critically low (" + last.pH.toFixed(2) + ") — enzyme activity impaired below 6.5. Increased base addition required.");
      } else if (last.pH > 7.5 && deviatesFromGolden("pH", last.pH, gPH, "high", 7.5)) {
        evidenceScore += 1.4;
        evidence.push("pH elevated (" + last.pH.toFixed(2) + ") above 7.5 — sporulation risk increases with alkaline pH shift.");
      } else if (last.pH >= 6.5 && last.pH < 6.8 && deviatesFromGolden("pH", last.pH, gPH, "low", 6.8)) {
        evidenceScore += 0.8;
        evidence.push("pH below optimal range (" + last.pH.toFixed(2) + ") — monitor base addition strategy.");
      }
    }

    // RQ for Bacillus
    try {
      const rq = calcRQ(data);
      if (rq !== null) {
        if (rq > 1.3) {
          evidenceScore += 1.2;
          evidence.push("RQ=" + rq + " — overflow metabolism. Reduce carbon source feed rate to limit sporulation trigger.");
        }
      }
    } catch(e) {}
  }
  if (orgId==="ecoli") {
    const gAcet = gLast_org ? gLast_org.acetate_mM : null;
    if (deviatesFromGolden("acetate_mM", last.acetate_mM, gAcet, "high", 10))
      { evidenceScore += 2.2; evidence.push("Acetate accumulation above reference batch trajectory"); }

    // Specific growth rate — calculated from OD600 trajectory
    try {
      const mu = calcMuEcoli(data);
      const gMu = gLast_org ? calcMuEcoli(golden.filter(r=>r.time_hours<=last.time_hours)) : null;
      if (mu !== null) {
        if (mu > 0.20) {
          evidenceScore += 1.6;
          evidence.push("Specific growth rate mu=" + mu + " h-1 — overflow metabolism threshold (>0.20) — acetate accumulation imminent");
        } else if (mu < 0.05 && runPct > 40 && gMu !== null && gMu >= 0.05) {
          // Only fire if golden batch shows healthy growth but current run does not
          evidenceScore += 1.0;
          evidence.push("Specific growth rate mu=" + mu + " h-1 — poor growth vs reference batch (" + gMu + " h-1)");
        } else if (gMu !== null && Math.abs(mu - gMu) > 0.05) {
          evidenceScore += 0.6;
          evidence.push("Specific growth rate mu=" + mu + " h-1 deviating from reference batch (" + gMu + " h-1)");
        }
      }
    } catch(e) {}

    // Temperature shift detection
    try {
      const tempShift = detectTempShift(data, runPct);
      if (tempShift && tempShift.concern) {
        evidenceScore += tempShift.evidenceScore;
        evidence.push(tempShift.evidenceText);
      }
    } catch(e) {}

    // Respiratory Quotient
    try {
      const rq = calcRQ(data);
      const gRq = golden ? calcRQ(golden.filter(r=>r.time_hours<=last.time_hours)) : null;
      if (rq !== null) {
        if (rq > 1.2) {
          evidenceScore += 1.4;
          evidence.push("RQ=" + rq + " — overflow metabolism active (>1.2). Reduce carbon source feed rate.");
        } else if (rq > 1.0 && (gRq === null || rq > gRq + 0.15)) {
          evidenceScore += 0.8;
          evidence.push("RQ=" + rq + " — approaching overflow threshold. Monitor feed rate.");
        } else if (rq < 0.8 && (gRq === null || rq < gRq - 0.15)) {
          evidenceScore += 0.6;
          evidence.push("RQ=" + rq + " — below expected range. Possible carbon limitation.");
        }
      }
    } catch(e) {}
  }
  if (orgId==="yeast") {
    const gEth = gLast_org ? gLast_org.ethanol_g_L : null;
    const gDO_y = gLast_org ? gLast_org.DO_percent : null;
    const gPH_y = gLast_org ? gLast_org.pH : null;
    const gGlc_y = gLast_org ? gLast_org.glucose_mM : null;

    // Ethanol accumulation — primary Crabtree effect signal
    // Weight scaled by severity: >8 g/L is product-toxic, >12 g/L is critical
    if (last.ethanol_g_L != null) {
      if (last.ethanol_g_L > 12 && deviatesFromGolden("ethanol_g_L", last.ethanol_g_L, gEth, "high", 12))
        { evidenceScore += 2.8; evidence.push("Ethanol critically elevated (>" + last.ethanol_g_L.toFixed(1) + "g/L) — Crabtree overflow severe"); }
      else if (last.ethanol_g_L > 5 && deviatesFromGolden("ethanol_g_L", last.ethanol_g_L, gEth, "high", 5))
        { evidenceScore += 2.0; evidence.push("Ethanol above warn threshold — Crabtree overflow active. Reduce glucose feed 30-40%."); }
      else if (last.ethanol_g_L > 3 && deviatesFromGolden("ethanol_g_L", last.ethanol_g_L, gEth, "high", 3))
        { evidenceScore += 1.4; evidence.push("Ethanol accumulating above reference batch trajectory — overflow metabolism onset"); }
    }

    // Glucose — elevated glucose in yeast drives overflow metabolism
    if (last.glucose_mM != null && last.glucose_mM > 10 && deviatesFromGolden("glucose_mM", last.glucose_mM, gGlc_y, "high", 8))
      { evidenceScore += 1.2; evidence.push("Glucose elevated above 10mM — overflow metabolism risk. Reduce feed rate immediately."); }

    // DO declining faster than reference batch — high biomass + ethanol oxidation demand
    if (last.DO_percent != null && deviatesFromGolden("DO_percent", last.DO_percent, gDO_y, "low", 30))
      { evidenceScore += 1.0; evidence.push("DO declining faster than reference batch trajectory — ethanol oxidation increasing oxygen demand"); }

    // pH dropping — organic acid and CO2 accumulation
    if (last.pH != null && deviatesFromGolden("pH", last.pH, gPH_y, "low", 4.8))
      { evidenceScore += 0.8; evidence.push("pH dropping faster than reference batch — organic acid accumulation from overflow metabolism"); }
  }
  if (orgId==="anaerobic") {
    const gDO = gLast_org ? gLast_org.DO_percent : null;
    // Oxygen ingress — any DO above 0.1% that also exceeds golden batch is alarming
    if (last.DO_percent > 0.1 && (gDO == null || last.DO_percent > gDO + 0.05))
      { evidenceScore += 3.0; evidence.push("Oxygen detected above reference batch baseline — ingress risk"); }
  }
  if (orgId==="cho") {
    const gDO   = gLast_org ? gLast_org.DO_percent    : null;
    const gGlc  = gLast_org ? gLast_org.glucose_mM    : null;
    const gNH3  = gLast_org ? gLast_org.ammonia_mM    : null;
    const gCO2  = gLast_org ? gLast_org.pCO2_mmHg     : null;
    const gGln  = gLast_org ? gLast_org.glutamine_mM  : null;
    const gOsm  = gLast_org ? gLast_org.osmolality_mOsm : null;

    if (deviatesFromGolden("DO_percent", last.DO_percent, gDO, "low", 35))
      { evidenceScore += 1.0; evidence.push("DO declining faster than reference batch trajectory"); }
    if (deviatesFromGolden("glucose_mM", last.glucose_mM, gGlc, "low", 12))
      { evidenceScore += 1.0; evidence.push("Glucose declining faster than reference batch trajectory"); }

    // Ammonia — elevated above golden batch AND above threshold
    // High weight: glycosylation risk makes this a product quality signal, not just a growth signal
    if (last.ammonia_mM != null && !isNaN(last.ammonia_mM)) {
      if (last.ammonia_mM > 8) {
        evidenceScore += 2.4;
        evidence.push("Ammonia critically elevated (>" + last.ammonia_mM.toFixed(1) + "mM) — N-glycosylation risk");
      } else if (last.ammonia_mM > 5 && deviatesFromGolden("ammonia_mM", last.ammonia_mM, gNH3, "high", 5)) {
        evidenceScore += 1.6;
        evidence.push("Ammonia above 5mM — growth inhibition and glycosylation impairment risk");
      }
    }

    // pCO2 — CO2 accumulation at high VCD
    // High weight: primary scale-up failure mode, irreversible above 200 mmHg
    if (last.pCO2_mmHg != null && !isNaN(last.pCO2_mmHg)) {
      if (last.pCO2_mmHg > 150) {
        evidenceScore += 2.2;
        evidence.push("pCO2 critically elevated (>" + last.pCO2_mmHg.toFixed(0) + "mmHg) — CO2 stripping insufficient");
      } else if (last.pCO2_mmHg > 120 && deviatesFromGolden("pCO2_mmHg", last.pCO2_mmHg, gCO2, "high", 120)) {
        evidenceScore += 1.4;
        evidence.push("pCO2 rising toward critical threshold — increase agitation and sweep gas");
      }
    }

    // Glutamine depletion — upstream of ammonia problem
    if (last.glutamine_mM != null && !isNaN(last.glutamine_mM)) {
      if (last.glutamine_mM < 0.5 && deviatesFromGolden("glutamine_mM", last.glutamine_mM, gGln, "low", 0.5)) {
        evidenceScore += 1.2;
        evidence.push("Glutamine critically depleted — ammonia accumulation likely");
      }
    }

    // Osmolality — compounding stress factor
    if (last.osmolality_mOsm != null && !isNaN(last.osmolality_mOsm)) {
      if (last.osmolality_mOsm > 420 && deviatesFromGolden("osmolality_mOsm", last.osmolality_mOsm, gOsm, "high", 420)) {
        evidenceScore += 1.4;
        evidence.push("Osmolality critically elevated — osmotic stress compounding metabolic stress");
      } else if (last.osmolality_mOsm > 380 && deviatesFromGolden("osmolality_mOsm", last.osmolality_mOsm, gOsm, "high", 380)) {
        evidenceScore += 0.8;
        evidence.push("Osmolality approaching stress threshold");
      }
    }
  }
  if (orgId==="pichia") {
    const gDO_p   = gLast_org ? gLast_org.DO_percent       : null;
    const gMeOH_p = gLast_org ? gLast_org.methanol_percent : null;
    const gDCW_p  = gLast_org ? gLast_org.DCW_g_L          : null;
    const phase   = last.phase;

    // Phase I -> II transition signal: DO spike at glycerol exhaustion is the module's
    // earliest, cheapest kill signal (structurally equivalent to Bacillus hour-3 GP divergence).
    // A delayed or absent spike relative to the golden batch's transition timing is itself diagnostic.
    if (phase === "transition" && deviatesFromGolden("DO_percent", last.DO_percent, gDO_p, "low", 22))
      { evidenceScore += 1.6; evidence.push("Expected DO spike at glycerol exhaustion is absent or delayed vs reference batch — check inoculum, contamination, or glycerol charge"); }

    // Dominant induction-phase failure mode: methanol feed outpacing DO/utilization capacity.
    // Mechanistically direct (not a classification problem the way AAV's stress-vs-crash is) —
    // DO failing to track or recover from a feed increase is the primary signal.
    if (phase === "methanol_induction") {
      if (deviatesFromGolden("DO_percent", last.DO_percent, gDO_p, "low", 15))
        { evidenceScore += LIKELIHOOD.pichia_do_mismatch - 1.0; evidence.push("DO failing to track methanol feed rate — feed outpacing utilization capacity (AOX1/AOX2), approaching toxic methanol accumulation"); }

      if (last.methanol_percent != null && !isNaN(last.methanol_percent)) {
        if (deviatesFromGolden("methanol_percent", last.methanol_percent, gMeOH_p, "high", 1.0))
          { evidenceScore += LIKELIHOOD.pichia_methanol_high - 1.0; evidence.push("Methanol concentration above reference batch control band (typ. 0.5-1.0%) — toxicity risk rising"); }
      }

      // Growth stall/decline during induction — direct DCW deviation vs golden trajectory
      if (deviatesFromGolden("DCW_g_L", last.DCW_g_L, gDCW_p, "low", (gDCW_p||0)*0.85))
        { evidenceScore += 1.0; evidence.push("Biomass (DCW) falling behind reference batch trajectory during induction — possible methanol stress or nutrient limitation"); }
    }
  }

  // ── CAR-T SPECIFIC SCORING ──────────────────────────────────────────────
  if (orgId === "cart") {
    const gViab_p = golden ? (golden.find(r=>Math.abs(r.time_hours-runHour)<4)||{}).viability_percent : null;
    const gDens_p = golden ? (golden.find(r=>Math.abs(r.time_hours-runHour)<4)||{}).cell_density_E6_per_mL : null;
    const gFold_p = golden ? (golden.find(r=>Math.abs(r.time_hours-runHour)<4)||{}).fold_expansion : null;

    // Viability collapse — the primary CAR-T signal
    if (last.viability_percent != null) {
      if (last.viability_percent < 70)
        { evidenceScore += LIKELIHOOD.cart_viability_crit - 1.0; evidence.push("Viability critically low (<70%) — activation failure or contamination event likely; recovery without root cause resolution is unlikely"); }
      else if (last.viability_percent < 80)
        { evidenceScore += LIKELIHOOD.cart_viability_warn - 1.0; evidence.push("Viability below 80% — approaching critical threshold; monitor every 24h, check media lot and activation reagent lot"); }
      else if (gViab_p && deviatesFromGolden("viability_percent", last.viability_percent, gViab_p, "low", gViab_p*0.06))
        { evidenceScore += 1.2; evidence.push("Viability tracking below reference batch trajectory — early decline signal; trend matters more than single timepoint"); }
    }

    // Expansion stall — critical early signal (day 5+ = hour 120+)
    if (last.fold_expansion != null && runHour > 120) {
      if (last.fold_expansion < 5)
        { evidenceScore += LIKELIHOOD.cart_expansion_stall - 1.0; evidence.push("Fold expansion below 5x by day 5 — expansion stall; verify activation markers, cytokine concentration, and media lot against reference batch"); }
      else if (gFold_p && deviatesFromGolden("fold_expansion", last.fold_expansion, gFold_p, "low", gFold_p*0.25))
        { evidenceScore += 1.5; evidence.push("Fold expansion tracking below reference batch trajectory — monitor closely; compare media lot and activation protocol"); }
    }

    // Contamination pattern: lactate spike concurrent with viability drop
    if (last.lactate_mM != null && last.viability_percent != null &&
        last.lactate_mM > 15 && last.viability_percent < 85)
      { evidenceScore += LIKELIHOOD.cart_contamination - 1.0; evidence.push("Concurrent lactate elevation and viability decline — contamination pattern; check sterility indicators before proceeding"); }

    // Cell density deviation
    if (last.cell_density_E6_per_mL != null && gDens_p &&
        deviatesFromGolden("cell_density_E6_per_mL", last.cell_density_E6_per_mL, gDens_p, "low", gDens_p*0.3))
      { evidenceScore += 1.3; evidence.push("Cell density falling behind reference batch trajectory — expansion impaired relative to reference run at this time point"); }
  }
  if (stage==="terminal" && evidenceScore > 1.5) { evidenceScore += 0.4; }

  // Layer 2 + 3 — Convolutional trajectory signals
  if (convResult.signals.length > 0) {
    evidenceScore += convResult.evidenceScore;
    convResult.signals.forEach(s => evidence.push(s.text));
  }

  // Layer 0 — GP confidence band violations (most fundamental signal)
  // Check each parameter against its GP posterior predictive interval
  //
  // TRANSPARENCY NOTE: every GP band is built from a single golden-batch reference run
  // unless a real batch archive is loaded (see buildGPBandsStaged / STAGED CALIBRATION
  // FRAMEWORK above). Synthetic healthy-variant testing (~3-5% realistic run-to-run
  // variance, no injected fault) confirmed high false-flag rates on genuinely healthy
  // batches for these parameters, tested across all six organism modules:
  //   - pH: confirmed in all 6 modules (50-95% false-flag rate)
  //   - viability_percent: confirmed in 5/6 modules (Bacillus, E. coli, Yeast, CHO, Anaerobic)
  //   - temperature_C: confirmed in Pichia (64%) and E. coli (18%)
  //   - DO_percent, glucose_mM, osmolality_mOsm: confirmed in CHO (38-44%)
  // This list reflects only what's been verified via testing, not an assumption that
  // other parameters are risk-free. Below, this only adds a disclosure to the evidence
  // text (pre-archive) or a real calibration-stage label (once an archive exists) —
  // it never silently changes band math without real data backing it.
  const GP_BAND_UNVALIDATED = {
    bacillus:   ["pH", "viability_percent"],
    ecoli:      ["pH", "viability_percent", "temperature_C"],
    yeast:      ["pH", "viability_percent"],
    cho:        ["pH", "viability_percent", "DO_percent", "glucose_mM", "osmolality_mOsm"],
    anaerobic:  ["pH", "viability_percent"],
    pichia:     ["pH", "temperature_C", "glycerol_feed_mL_L_hr", "methanol_feed_mL_L_hr"],
    cart:       ["pH", "viability_percent", "temperature_C", "fold_expansion"],
  };

  // rows -> {time_hours: value} map for a given parameter key (used to feed real
  // archive batches into buildGPBandsStaged, which expects this shape).
  function rowsToParamMap(rows, key) {
    const map = {};
    (rows || []).forEach(r => { if (r[key] != null && !isNaN(r[key]) && r.time_hours != null) map[r.time_hours] = r[key]; });
    return map;
  }

  if (golden && golden.length >= 3) {
    const testTimes = data.map(r => r.time_hours).filter(t => t != null && !isNaN(t));
    const realArchive = archive || []; // array of real historical batches (row-arrays), or [] — default preserves exact current behavior
    params.forEach(p => {
      try {
        const archiveMaps = realArchive.map(batchRows => rowsToParamMap(batchRows, p.key))
                                        .filter(m => Object.keys(m).length > 0);
        const staged = buildGPBandsStaged(golden, archiveMaps, testTimes, p.key);
        if (!staged) return;
        const { bands, nBatches, multiplier } = staged;
        const violation = checkGPViolation(data, bands, p.key, golden);
        if (violation) {
          const sigmas = Math.abs((violation.value - violation.mean) /
            (Math.abs(violation.upper - violation.mean) / multiplier + 0.001));
          const sigmaLabel = sigmas > 3 ? ">3SD" : sigmas > 2 ? "2SD" : "2SD";
          let confidenceNote;
          if (nBatches <= 1) {
            const isUnvalidated = (GP_BAND_UNVALIDATED[orgId] || []).includes(p.key);
            confidenceNote = isUnvalidated
              ? " [UNVALIDATED BAND — single-batch reference; false-flag risk confirmed via synthetic healthy-variant testing, treat with caution until calibrated against real inter-batch data]"
              : "";
          } else {
            const stage = calibrationStage(nBatches);
            confidenceNote = " [" + stage.label + " — " + stage.detail + "]";
          }
          evidence.push(p.label + " exits GP confidence band at Hour " +
            violation.hour + " — " + sigmaLabel +
            " deviation from posterior predictive interval (" +
            violation.direction + " band)" + confidenceNote);
          evidenceScore += Math.min(2.0, sigmas * 0.6);
        }
      } catch(e) { /* GP calculation failed gracefully — continue */ }
    });
  }


  // Layer CHO Lactate + Alanine Shift — run stage aware metabolic trajectory intelligence
  if (orgId === "cho" && data && data.length > 0) {
    try {
      const lacShift = detectLactateShift(data, golden, runPct, runHour);
      if (lacShift && lacShift.concern) {
        evidenceScore += lacShift.evidenceScore;
        if (lacShift.evidenceText) evidence.push(lacShift.evidenceText);
      }
      // Alanine shift — if data present
      const alaShift = detectAlanineShift(data, golden, runPct, runHour);
      if (alaShift && alaShift.concern) {
        evidenceScore += alaShift.evidenceScore;
        if (alaShift.evidenceText) evidence.push(alaShift.evidenceText);
      }
    } catch(e) { /* graceful fallback */ }
  }

  // Convert additive score to likelihood ratio — capped at MAX_LIKELIHOOD
  const likelihood = Math.min(MAX_LIKELIHOOD, 1.0 + evidenceScore);

  // Step 3 — Posterior = normalize likelihood x prior
  // Using simplified Bayesian update: posterior = (likelihood x prior) / ((likelihood x prior) + (1-prior))
  const posterior = (likelihood * baseline) / ((likelihood * baseline) + (1 - baseline));
  const posteriorPct = Math.min(99, Math.round(posterior * 100));
  const baselinePct = Math.round(baseline * 100);

  // Step 4 — Determine risk level from posterior
  const riskLevel = posteriorPct >= 70 ? "CRITICAL" : posteriorPct >= 40 ? "ELEVATED" : posteriorPct >= 25 ? "MODERATE" : "NOMINAL";
  const riskColor = posteriorPct >= 70 ? "#EF4444" : posteriorPct >= 40 ? "#EAB308" : posteriorPct >= 25 ? "#FB923C" : "#22C55E";

  return { baseline:baselinePct, pdi:posteriorPct, likelihood:Math.round(likelihood*10)/10, riskLevel, riskColor, evidence, stage, runHour, usingUncalibratedBaseline };
}
